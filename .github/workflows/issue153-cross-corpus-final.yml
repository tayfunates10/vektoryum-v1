name: Issue153 cross corpus final

on:
  push:
    branches:
      - codex/ai4-round3-gradient-topology
    paths:
      - .github/workflows/issue153-cross-corpus-final.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:engine
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply patch script
        run: python .github/issue153_cross_corpus_patch.py
      - name: Focused contracts
        run: |
          python -m py_compile engine/app/pipeline.py engine/app/transform_journal.py engine/test_issue153_manager_cross_corpus.py
          python -m pytest -q engine/test_issue153_manager_cross_corpus.py engine/test_transform_journal.py engine/test_ai2_component_quality.py engine/test_analyzer_contracts.py engine/test_issue153_post_refit_contract.py
      - name: Commit source only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/app/pipeline.py engine/app/transform_journal.py engine/test_issue153_manager_cross_corpus.py
          git commit -m "fix(issue153): preserve target and exact-palette dominance"
          git fetch origin codex/ai4-round3-gradient-topology
          git rebase origin/codex/ai4-round3-gradient-topology
          git push origin HEAD:codex/ai4-round3-gradient-topology
