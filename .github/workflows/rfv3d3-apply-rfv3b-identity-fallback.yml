name: RFV-3D3 apply RFV-3B reviewed-identity fallback

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-apply-rfv3b-identity-fallback.yml"

permissions:
  contents: write

concurrency:
  group: rfv3d3-rfv3b-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-tested-fallback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode and verify exact workflow patch
        env:
          PATCH_B64: |
            eNqtV1tv2zYUfvevIIQBdWBTli+Ro7QG2m0ptqcESdahSAOBIimLjSQqIuXYSfPfR0qyY12cus78oog633fuhyeE+T6AcM4kQANTPYLMGzzw9M4P+YMYpBSF
            UL2GBPqM0JDJFUz9xdiDIVtQcxWFwDsI1mExoUvg4GObTnzTtIofGFqWPZlL5V1r+4+fzcw5c1pwb/PZwgI8kLPT/CGzIFr23W8L4g5hz72pZCc9t8JYFz2G
            psr1e9l1xQlPMDXG36P9Rk4pO8bTEjMH+MSBZCZsxDiZgo1ME7ZlWWvcrzu3w9HkXh6OruNNRfYlEtbT88Bm5nXieAiohI0Oe7EHiZQ4mEu4W/HAHT03nSSe
            YhU5jCoq+kjaTeMTjC0NoQKSJ9LMoOWaGNTdIIBfUG9l1MDPN2aI89i4KQ6Z1ZJFcZsiH+J0PH7FT2H6vH01u1BXmQMUhnrJZWAxD4kgK4CxAqKj7U0CnWg/9
            H7pvIC2Y++/0W+5fE+9QaN5XnCKGklo+xQsY8RWb9CmG9Ew1o5KcD4ixZy3YMTw3TIIqyIxTqGZEfCe59T0qM04nL8F2tMpbzJjzuLQgn0X2Ky7rG5cPjuaT
            wvAluJwf7UydgDP7YZvOBTVySjqOp4g8szJSQSOmGzNF48LxjYJBvmCCH62zjydhVH3CXCU8Z5mPKBTD8pL+Sdppl7hcyEMen0Snn3Sg5lnmJR2+wteOHiW5
            dGU89R3FW+kbSLvtlpo1tbu6Dew9X6Fd+soq7jY0uYH0d9VCsXk+iI21DyD18uAxVz67iG+8FRITTFxFroE1vJQUlD18Wpn0Y2mZLEt0YTcT2hQXv5rOGbED
            T+BwGlFudbLs1QaWzngcpUSMj0uVzXuJQf9+RRMv9QvbC0VEPC0njnEnC6Lqi/fBQfoO73Ew3EeFk6eiG8ykn6G73ufBk88T7HOcGdXHnXKj2cG+9d37Hbd
            LMnaB2mxQY8YlUG5E7LCwwuO+Vr0rvmZ4jDhw8eP7fb2crlY/vrq+fPrB9jZH4Oxezy8Xm5uPj5vfrh8uPr6v7hZfJytH2EPbYXtP/nPvv4F/K4+fnV6O5s
            p1qTGkdtQum71mJBWJLX8lAaa9vx3j7dAY3NuG3b4HrgcZmFapewqvvL0y4RTm1NnZi05Vle5ceqHmYpzqD8wMltWq5rpXO6f8cqONQwgPfrhtUe6Ch1BhLw
            mNG5LW0HjcfOTZKyCm7PJ8k2Ga0n5WkG2Yq/KzNMzXr1UTocHjk/FoV/6TglwiS3YlAekV3uJSgyjS0JoLFyqx8Hef5UjYfFv2Nfk5XGxO2s2rY1RbMVNW5t
            8xUjsVDjmItyZ5C4LGu5dDQYnPkpvhyFC4yyiK2I8V83Ihm4x6RgbiP3TkXOkxNoqz3GrqQ2phm0DcR7cBaexP0j+D5Ac56rYraS+8bUv8wLp8z9MFXuF2U
            5zYOpvl0Nl+soYxQJc5D2BvwzKK9XCj+nF3vQgHnw+/+OfiVX6CnV1b1vgYxA++KoZV1aJP7yd2Y3/z9v0+W57vD7vKLvW6fOm+a8s/JP1Dl39V+mcs/wN
            LRbXy4uvvX5Wjquj6tJp0Zf6F6M47jx8OGwo5P6V5Yr4sWyjmsxDWzNfNrXVD+8u79vd2c99GRTua2laQ9teUkdqU5zhzXaPxQVwRzOr+3I/etMKHWnKExu
            QNjN+gC+Tdv4t4E+8ehgg/bYQ5u7kFtIYrL8+VUw9yNQnY/Z6dcJCv5Tzo9Gk2a9QOE+4oZ2+KVMpKT0jJK8jI6cHQwR6RwxBzH0A5RwsFnR4LOJqpHK0XQ
            SgKxYhQ4g8gTMEg4EGdY8n6uL8QfVQtU8/gdV0j/ACvSxp8=
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import zlib
          from pathlib import Path

          payload = ''.join(os.environ['PATCH_B64'].split())
          data = zlib.decompress(base64.b64decode(payload))
          expected = '2790fb3608460b6610773c01aca4f24b6253a6e33c098186afa25841abc50cf7'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch digest mismatch: {actual} != {expected}')
          Path('/tmp/rfv3b-reviewed-identity.patch').write_bytes(data)
          PY
          git apply --check /tmp/rfv3b-reviewed-identity.patch
          git apply /tmp/rfv3b-reviewed-identity.patch

      - name: Validate workflow syntax and unchanged RFV contracts
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path

          paths = [
              Path('.github/workflows/real-world-fidelity-rfv3b-live.yml'),
              Path('.github/workflows/real-world-fidelity-rfv3e-viewbox-fix.yml'),
          ]
          for path in paths:
              document = yaml.safe_load(path.read_text())
              if not isinstance(document, dict) or 'jobs' not in document:
                  raise SystemExit(f'invalid workflow document: {path}')

          workflow = yaml.safe_load(paths[0].read_text())
          steps = workflow['jobs']['acquire']['steps']
          acquire = next(step for step in steps if step.get('name') == 'Acquire or restore the exact 24 reviewed sources')
          Path('/tmp/rfv3b-acquire.sh').write_text(acquire['run'])
          PY
          bash -n /tmp/rfv3b-acquire.sh
          PYTHONPATH=engine python -m unittest \
            engine.regression.test_rfv3_live_measurement \
            engine.regression.test_rfv3_live_prepare
          grep -Fq 'reviewed_identity_mismatch' .github/workflows/real-world-fidelity-rfv3b-live.yml
          grep -Fq '5f151a6cb1a433b0cb0989a67bd7cc7940162f4b36d67903d6ccdd173f9e7d89' \
            .github/workflows/real-world-fidelity-rfv3b-live.yml

      - name: Commit reviewed-identity fallback
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/workflows/rfv3d3-apply-rfv3b-identity-fallback.yml
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "Fail over RFV-3B on reviewed corpus identity mismatch"
          git push origin "HEAD:${HEAD_REF}"
