name: RFV-3D3 alpha journal diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-alpha-journal-diagnostic.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: rfv3d3-alpha-journal-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  VEKTORYUM_WORKERS: "1"
  VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PINNED_ARTIFACT_ID: "8630061266"
  PINNED_ARTIFACT_DIGEST: "sha256:ded13a91be73fc00482f7d1f47404b1b4e08b000dc3ededadf58bdd59a2f6b33"

jobs:
  diagnose-alpha-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Prove production tree equals current main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" "${VALIDATION_SHA}"
          git diff --quiet "${BASE_SHA}" "${VALIDATION_SHA}" -- engine/app engine/benchmark engine/requirements.txt
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libcairo2
          python -m pip install -r engine/requirements.txt pytest httpx
      - name: Download immutable corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rfv3d3-alpha-source"
          mkdir -p "${root}"
          curl --fail-with-body --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}" \
            --output "${root}/metadata.json"
          curl --fail-with-body --location --silent --show-error --retry 3 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            --output "${root}/corpus.zip"
          RFV_ROOT="${root}" python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RFV_ROOT"])
          metadata = json.loads((root / "metadata.json").read_text())
          assert metadata["id"] == int(os.environ["PINNED_ARTIFACT_ID"])
          assert metadata["digest"] == os.environ["PINNED_ARTIFACT_DIGEST"]
          with zipfile.ZipFile(root / "corpus.zip") as package:
              bundle = package.read("rfv2-public-corpus.tar.gz")
              checksums = package.read("bundle-checksums.json")
          assert hashlib.sha256(bundle).hexdigest() == "1da641ad27b58985e4e1cf8d9972af5a15f5105e85e2c319151a5e373b6afc46"
          assert hashlib.sha256(checksums).hexdigest() == "ff39ab6e320dbede7241ceefa9eea87d31c3b4e52bb31366aa49278067826655"
          (root / "rfv2-public-corpus.tar.gz").write_bytes(bundle)
          destination = root / "corpus"
          destination.mkdir()
          with tarfile.open(root / "rfv2-public-corpus.tar.gz", "r:gz") as archive:
              archive.extractall(destination, filter="data")
          PY
      - name: Run Q04/Q05 exact journal diagnostic
        run: |
          mkdir -p "${RUNNER_TEMP}/rfv3d3-alpha-diagnostic"
          RFV_ROOT="${RUNNER_TEMP}/rfv3d3-alpha-source/corpus" \
          RFV_OUT="${RUNNER_TEMP}/rfv3d3-alpha-diagnostic" \
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import shutil
          import tempfile
          import traceback
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import numpy as np
          from PIL import Image

          from app import pipeline
          from app.alpha_candidate_knockout import _path_node_counts, _render_root, _viewbox
          from app.alpha_candidate_validation import validate_alpha_reconstruction_contract
          from app.alpha_preprocess import _rgba_from_source_at_size
          from app.alpha_soft_ellipse import (
              _build_soft_ellipse_tree,
              fit_soft_ellipse,
          )
          from app.alpha_artwork_identity import alpha_transaction_id
          from app.transform_journal import TransformJournal
          from app.alpha_svg_mask import _journal_source_rgb
          from app.alpha_mask_budget import _journal_limits
          from app.alpha_candidate_knockout import _write_tree_to_temp

          root = Path(os.environ["RFV_ROOT"])
          out = Path(os.environ["RFV_OUT"])
          manifest = json.loads((root / "qualification-manifest.json").read_text())
          cases = {item["case_id"]: item for item in manifest["cases"]}

          def serializable(value):
              if isinstance(value, np.ndarray):
                  return {
                      "shape": list(value.shape),
                      "dtype": str(value.dtype),
                      "sha256": hashlib.sha256(np.ascontiguousarray(value).tobytes()).hexdigest(),
                  }
              if isinstance(value, dict):
                  return {str(k): serializable(v) for k, v in value.items() if not str(k).startswith("_render")}
              if isinstance(value, (list, tuple)):
                  return [serializable(v) for v in value]
              if isinstance(value, Path):
                  return str(value)
              return value

          reports = []
          for case_id in ("qualification-public-04", "qualification-public-05"):
              item = cases[case_id]
              source = root / item["qualified_asset_path"]
              case_dir = out / case_id
              case_dir.mkdir(parents=True)
              report = {
                  "case_id": case_id,
                  "category": item["category"],
                  "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                  "engine_sha": os.environ["VALIDATION_SHA"],
                  "base_sha": os.environ["BASE_SHA"],
              }
              try:
                  with tempfile.TemporaryDirectory() as temporary:
                      temp = Path(temporary)
                      result = pipeline.run_pipeline(
                          source,
                          temp,
                          requested_mode="auto",
                          quality="detailed",
                          formats=("svg",),
                      )
                      selected = Path(result["outputs"]["svg"])
                      parent_bytes = selected.read_bytes()
                      parent_root = ET.fromstring(parent_bytes)
                      parent_counts = _path_node_counts(parent_root)
                      report["selected_candidate"] = result.get("selected_candidate")
                      report["pipeline_mode"] = result.get("mode")
                      report["parent_sha256"] = hashlib.sha256(parent_bytes).hexdigest()
                      report["parent_counts"] = list(parent_counts)
                      report["parent_bytes"] = len(parent_bytes)

                      with Image.open(source) as image:
                          source_size = image.size
                          source_rgb = _journal_source_rgb(image)
                      source_full = _rgba_from_source_at_size(source, source_size)
                      source_alpha = np.asarray(source_full[:, :, 3], dtype=np.uint8)
                      fitted = fit_soft_ellipse(source_alpha)
                      report["soft_ellipse_fit"] = serializable(fitted)
                      if fitted is None:
                          raise RuntimeError("soft ellipse unexpectedly not applicable")
                      box, geometry, binary_overlap = fitted
                      parent_sha = hashlib.sha256(parent_bytes).hexdigest()
                      alpha_sha = hashlib.sha256(np.ascontiguousarray(source_alpha).tobytes()).hexdigest()
                      transaction_id = alpha_transaction_id(parent_sha, alpha_sha, result.get("mode") or "auto", "soft-ellipse")
                      candidate_root = _build_soft_ellipse_tree(
                          parent_root,
                          source_alpha.shape,
                          geometry,
                          transaction_id,
                      )
                      candidate = _write_tree_to_temp(candidate_root, selected)
                      try:
                          limits = _journal_limits(parent_root, len(parent_bytes))
                          report["limits"] = limits
                          report["candidate_bytes"] = candidate.stat().st_size
                          report["candidate_sha256"] = hashlib.sha256(candidate.read_bytes()).hexdigest()
                          validation = validate_alpha_reconstruction_contract(
                              candidate,
                              source_full,
                              result.get("mode") or "auto",
                              parent_counts,
                          )
                          report["alpha_validation"] = serializable(validation)

                          image_class = "photo" if result.get("mode") == "photo_poster" else "clean_logo"
                          journal = TransformJournal(
                              selected,
                              source_rgb,
                              image_class=image_class,
                              required_metrics=set(),
                          )
                          before = journal._measure(parent_bytes)
                          after = journal._measure(candidate.read_bytes())
                          reasons = journal._decide(before, after, stage_id="source_alpha_vector_mask")
                          report["journal_before"] = serializable(before)
                          report["journal_after"] = serializable(after)
                          report["journal_deltas"] = serializable(journal._deltas(before, after))
                          report["journal_render_comparison"] = serializable(journal._render_comparison(before, after))
                          report["journal_reasons"] = reasons

                          journal_alpha = TransformJournal(
                              selected,
                              source_rgb,
                              image_class=image_class,
                              required_metrics={"alpha_fidelity"},
                          )
                          journal_alpha._measurement_stage_id = "restore_source_dimensions"
                          alpha_before = journal_alpha._measure(parent_bytes)
                          alpha_after = journal_alpha._measure(candidate.read_bytes())
                          alpha_comparison = journal_alpha._alpha_comparison(alpha_before, alpha_after)
                          report["parent_candidate_alpha_comparison"] = serializable(alpha_comparison)
                          report["direct_candidate_source_alpha_metrics"] = {
                              "bounded_alpha_iou": validation.get("bounded_alpha_iou"),
                              "bounded_alpha_mae": validation.get("bounded_alpha_mae"),
                              "native_alpha_iou": validation.get("native_alpha_iou"),
                              "native_alpha_mae": validation.get("native_alpha_mae"),
                              "evaluator_alpha_iou": validation.get("evaluator_alpha_iou"),
                              "evaluator_alpha_mae": validation.get("evaluator_alpha_mae"),
                          }
                          shutil.copy2(candidate, case_dir / "soft-ellipse-candidate.svg")
                      finally:
                          candidate.unlink(missing_ok=True)
              except Exception as exc:
                  report["diagnostic_error"] = f"{type(exc).__name__}:{exc}"
                  report["traceback"] = traceback.format_exc()
              encoded = (json.dumps(report, indent=2, sort_keys=True) + "\n").encode()
              (case_dir / "journal-diagnostic.json").write_bytes(encoded)
              (case_dir / "journal-diagnostic.sha256").write_text(
                  hashlib.sha256(encoded).hexdigest() + "\n", encoding="utf-8"
              )
              reports.append(report)

          summary = {
              "schema": "vektoryum-rfv3d3-alpha-journal-diagnostic-v1",
              "engine_sha": os.environ["VALIDATION_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "production_tree_equal_to_base": True,
              "cases": reports,
              "release_state": "RFV-3 pending / NO-GO / rfv4_allowed=false",
          }
          encoded = (json.dumps(summary, indent=2, sort_keys=True) + "\n").encode()
          (out / "summary.json").write_bytes(encoded)
          (out / "summary.sha256").write_text(
              hashlib.sha256(encoded).hexdigest() + "\n", encoding="utf-8"
          )
          if any(item.get("diagnostic_error") for item in reports):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfv3d3-alpha-journal-diagnostic-${{ env.VALIDATION_SHA }}
          path: ${{ runner.temp }}/rfv3d3-alpha-diagnostic
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
