name: Issue 153 manager remediation

on:
  push:
    branches:
      - codex/ai4-round3-gradient-topology
    paths:
      - .github/workflows/issue153-manager-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Patch production contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement count {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          rep('engine/app/analyzer.py', "    if unique_ratio > 0.095 and smooth_area_ratio > 0.68:\n        return True\n\n    h, w = arr.shape[:2]\n", "    if unique_ratio > 0.095 and smooth_area_ratio > 0.68:\n        return True\n\n    # Foreground-local promotion repairs opaque artwork whose uniform background\n    # diluted the legacy whole-frame signal. Alpha-bearing art is a separate\n    # paint model; preserve its historical routing unless the legacy test above\n    # already proved a gradient.\n    if bool(np.any(alpha < 255)):\n        return False\n\n    h, w = arr.shape[:2]\n")
          rep('engine/app/alpha_parent_selection.py', "_MAX_TRIALS = 4\n", "_MAX_ALPHA_LEVELS = 4\n_MAX_TRIALS = 4\n")
          rep('engine/app/alpha_parent_selection.py', "    # Parent probing is bounded by _MAX_TRIALS, not by the number of source\n    # alpha levels. Continuous/anti-aliased alpha still uses the exact same\n    # source-alpha reconstruction gates; only opaque sources are inapplicable.\n    if len(levels) <= 1:\n        return result\n", "    # Preserve the proven bounded parent-selection contract. Dense/continuous\n    # alpha stays on the dedicated alpha pipeline; broad parent probing changed\n    # previously accepted knockout topology without cross-corpus proof.\n    if len(levels) <= 1 or len(levels) > _MAX_ALPHA_LEVELS:\n        return result\n")
          rep('engine/app/pipeline.py', "def select_best(scored: list[dict[str, Any]], mode: str) -> tuple[dict, dict, str]:\n    \"\"\"Run the established selector inside the independent safe Pareto pool.\"\"\"\n    legacy_chosen, legacy_raw, legacy_reason = _base_select_best(scored, mode)\n    pool = _selection_pool(scored)\n    if len(pool) == len(scored) and all(a is b for a, b in zip(pool, scored)):\n        return legacy_chosen, legacy_raw, legacy_reason\n    chosen, _safe_raw, reason = _base_select_best(pool, mode)\n    guard = \"component_integrity_pareto_guard\" if any(\n        _is_selection_safe(candidate) for candidate in scored\n    ) else \"component_integrity_guard\"\n    return chosen, legacy_raw, f\"{guard}+{reason}\"\n", "def select_best(scored: list[dict[str, Any]], mode: str) -> tuple[dict, dict, str]:\n    \"\"\"Preserve a safe legacy winner; reroute only an actually unsafe winner.\"\"\"\n    legacy_chosen, legacy_raw, legacy_reason = _base_select_best(scored, mode)\n    if _is_selection_safe(legacy_chosen):\n        return legacy_chosen, legacy_raw, legacy_reason\n    safe = [candidate for candidate in scored if _is_selection_safe(candidate)]\n    if not safe:\n        return legacy_chosen, legacy_raw, legacy_reason\n    pool = _pareto_front(safe)\n    chosen, _safe_raw, reason = _base_select_best(pool, mode)\n    return chosen, legacy_raw, f\"component_integrity_pareto_guard+{reason}\"\n")
          rep('engine/app/pipeline.py', "def _apply_editability_preference(\n    scored: list[dict[str, Any]], current_best: dict[str, Any]\n) -> tuple[dict[str, Any], str]:\n    pool = _selection_pool(scored)\n    if current_best not in pool:\n        current_best = max(pool, key=_core._fidelity_rank_key)\n    return _base_apply_editability_preference(pool, current_best)\n", "def _apply_editability_preference(\n    scored: list[dict[str, Any]], current_best: dict[str, Any]\n) -> tuple[dict[str, Any], str]:\n    legacy_best, legacy_reason = _base_apply_editability_preference(scored, current_best)\n    if _is_selection_safe(legacy_best):\n        return legacy_best, legacy_reason\n    safe = [candidate for candidate in scored if _is_selection_safe(candidate)]\n    if not safe:\n        return legacy_best, legacy_reason\n    pool = _pareto_front(safe)\n    safe_seed = current_best if current_best in pool else max(pool, key=_core._fidelity_rank_key)\n    guarded_best, guarded_reason = _base_apply_editability_preference(pool, safe_seed)\n    return guarded_best, f\"component_integrity_pareto_guard+{guarded_reason}\"\n")
          PY
      - name: Focused regression tests
        env:
          PYTHONPATH: .:engine
        run: |
          python -m py_compile engine/app/analyzer.py engine/app/pipeline.py engine/app/alpha_parent_selection.py
          python -m pytest -q engine/test_analyzer_contracts.py engine/test_ai2_component_quality.py engine/test_transform_journal.py
      - name: Commit patch and remove runner
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue153-manager-remediation.yml
          git add engine/app/analyzer.py engine/app/pipeline.py engine/app/alpha_parent_selection.py
          git commit -m 'fix(issue153): apply manager cross-corpus remediation'
          git push origin HEAD:codex/ai4-round3-gradient-topology
