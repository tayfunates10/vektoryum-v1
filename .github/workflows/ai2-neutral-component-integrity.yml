name: AI-2 neutral/component integrity

on:
  pull_request:
    paths:
      - ".github/workflows/ai2-neutral-component-integrity.yml"
      - "engine/app/analyzer.py"
      - "engine/app/neutral_palette.py"
      - "engine/app/component_quality.py"
      - "engine/app/fidelity.py"
      - "engine/app/scoring.py"
      - "engine/app/pipeline.py"
      - "engine/test_ai2_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai2-neutral-component-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    env:
      PYTHONHASHSEED: "0"
      VEKTORYUM_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install production and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile AI-2 modules
        run: >-
          python -m py_compile
          app/analyzer.py app/neutral_palette.py app/component_quality.py app/scoring.py
          test_ai2_neutral_palette.py test_ai2_component_quality.py
      - name: Run AI-2 focused tests
        run: python -m pytest -q test_ai2_neutral_palette.py test_ai2_component_quality.py
