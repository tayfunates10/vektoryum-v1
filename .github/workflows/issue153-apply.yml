name: Issue 153 apply patch
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply general Issue 153 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          # P0-A: gradient detection uses foreground-local continuous transition evidence,
          # not global unique-count dilution and not fixture identity.
          replace('engine/app/analyzer.py', '''def detect_gradient_like_surface(image: Image.Image) -> bool:\n    small = resize_for_analysis(_rgba_to_rgb_on_white(image), 350)\n    arr = np.array(small).astype(np.float32)\n\n    flattened = arr.reshape(-1, 3)\n    rounded = (flattened // 8) * 8\n    unique_count = len(np.unique(rounded, axis=0))\n    unique_ratio = unique_count / flattened.shape[0]\n\n    gray = cv2.cvtColor(arr.astype(np.uint8), cv2.COLOR_RGB2GRAY)\n    edge_mask = cv2.Canny(gray, 70, 160) > 0\n    smooth_area_ratio = float(np.mean(~edge_mask))\n\n    return bool(unique_ratio > 0.095 and smooth_area_ratio > 0.68)\n''', '''def detect_gradient_like_surface(image: Image.Image) -> bool:\n    # Keep the legacy whole-frame signal, then add a foreground-local continuous\n    # paint test. Large uniform backgrounds dilute a real gradient's global\n    # unique-ratio, while a smooth ramp creates many small non-zero neighbour\n    # transitions *inside* the foreground. Discrete palette steps do not.\n    rgba = resize_for_analysis(image.convert("RGBA"), 400)\n    raw = np.asarray(rgba, dtype=np.uint8)\n    alpha = raw[..., 3]\n    rgb = raw[..., :3].astype(np.float32)\n    a = (alpha.astype(np.float32) / 255.0)[..., None]\n    arr = rgb * a + 255.0 * (1.0 - a)\n\n    flattened = arr.reshape(-1, 3)\n    rounded = (flattened // 8) * 8\n    unique_count = len(np.unique(rounded, axis=0))\n    unique_ratio = unique_count / max(1, flattened.shape[0])\n\n    gray = cv2.cvtColor(np.clip(arr, 0, 255).astype(np.uint8), cv2.COLOR_RGB2GRAY)\n    edge_mask = cv2.Canny(gray, 70, 160) > 0\n    smooth_area_ratio = float(np.mean(~edge_mask))\n    if unique_ratio > 0.095 and smooth_area_ratio > 0.68:\n        return True\n\n    h, w = arr.shape[:2]\n    ph, pw = max(2, round(h * 0.04)), max(2, round(w * 0.04))\n    corners = np.concatenate((\n        arr[:ph, :pw].reshape(-1, 3), arr[:ph, -pw:].reshape(-1, 3),\n        arr[-ph:, :pw].reshape(-1, 3), arr[-ph:, -pw:].reshape(-1, 3),\n    ))\n    background = np.median(corners, axis=0)\n    foreground = (np.linalg.norm(arr - background[None, None, :], axis=2) > 40.0) & (alpha > 40)\n    if int(np.count_nonzero(foreground)) < 20:\n        return False\n\n    pair_count = 0\n    continuous_count = 0\n    for first, second, mask in (\n        (arr[:, :-1], arr[:, 1:], foreground[:, :-1] & foreground[:, 1:]),\n        (arr[:-1, :], arr[1:, :], foreground[:-1, :] & foreground[1:, :]),\n    ):\n        distances = np.linalg.norm(first - second, axis=2)\n        pair_count += int(np.count_nonzero(mask))\n        continuous_count += int(np.count_nonzero(mask & (distances >= 1.0) & (distances <= 32.0)))\n    transition_ratio = float(continuous_count) / float(max(1, pair_count))\n    foreground_bins = np.unique((arr[foreground].astype(np.uint8) // 8), axis=0).shape[0]\n    return bool(\n        foreground_bins >= 12\n        and transition_ratio >= 0.08\n        and smooth_area_ratio >= 0.90\n    )\n''')

          # P0-C: selection consumes explicit safety metadata. If scoring supplied
          # safety and there is no safe candidate, fail closed instead of legacy fallback.
          replace('engine/app/pipeline_core.py', '''def _edge_f1(c: dict[str, Any]) -> float:\n    return float((c.get("score_details") or {}).get("edge_f1") or 0.0)\n\n\ndef _apply_editability_preference(''', '''def _edge_f1(c: dict[str, Any]) -> float:\n    return float((c.get("score_details") or {}).get("edge_f1") or 0.0)\n\n\ndef _selection_safe_pool(scored: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    annotated = any(\n        "selection_safe" in candidate or "selection_disqualified" in candidate\n        for candidate in scored\n    )\n    if not annotated:\n        return list(scored)\n    return [\n        candidate for candidate in scored\n        if candidate.get("selection_safe") is True\n        and candidate.get("selection_disqualified") is not True\n    ]\n\n\ndef _apply_editability_preference(''')
          replace('engine/app/pipeline_core.py', '''    rendered = [c for c in scored if c.get("rendered_ok") and c.get("fidelity_score") is not None]\n    if not rendered:\n        return current_best, "highest_total_score"\n''', '''    safe_scored = _selection_safe_pool(scored)\n    if not safe_scored:\n        return current_best, "no_selection_safe_editability_candidate"\n    rendered = [c for c in safe_scored if c.get("rendered_ok") and c.get("fidelity_score") is not None]\n    if not rendered:\n        return current_best, "highest_total_score"\n''')
          replace('engine/app/pipeline_core.py', '''def select_best(scored: list[dict[str, Any]], mode: str) -> tuple[dict, dict, str]:\n    """En iyi adayı profil kurallarına göre seçer. (best, raw_best, reason)."""\n    raw_best = max(scored, key=lambda c: c["total_score"])\n    by_name = {c["name"]: c for c in scored}\n''', '''def select_best(scored: list[dict[str, Any]], mode: str) -> tuple[dict, dict, str]:\n    """En iyi adayı yalnız quality-safe seçim havuzundan seçer."""\n    raw_best = max(scored, key=lambda c: c["total_score"])\n    safe_scored = _selection_safe_pool(scored)\n    if not safe_scored:\n        raise RuntimeError("no_selection_safe_candidate")\n    scored = safe_scored\n    by_name = {c["name"]: c for c in scored}\n''')

          # P0-B: alpha applicability is decoded alpha truth, not PNG/RGBA mode.
          replace('engine/app/pipeline_core.py', '''        if image.mode in ("RGBA", "LA", "PA") or (\n            image.mode == "P" and "transparency" in image.info\n        ):\n            rgba = np.asarray(image.convert("RGBA"))\n            alpha = rgba[:, :, 3].astype(np.float32)[:, :, None] / 255.0\n            journal_source_rgb = np.clip(\n                rgba[:, :, :3].astype(np.float32) * alpha + 255.0 * (1.0 - alpha),\n                0, 255,\n            ).astype(np.uint8)\n            journal_required = {"alpha_fidelity"}\n        else:\n            journal_source_rgb = np.asarray(image.convert("RGB"))\n            journal_required = set()\n''', '''        rgba = np.asarray(image.convert("RGBA"), dtype=np.uint8)\n        source_has_alpha = bool(np.any(rgba[:, :, 3] < 255))\n        if source_has_alpha:\n            alpha = rgba[:, :, 3].astype(np.float32)[:, :, None] / 255.0\n            journal_source_rgb = np.clip(\n                rgba[:, :, :3].astype(np.float32) * alpha + 255.0 * (1.0 - alpha),\n                0, 255,\n            ).astype(np.uint8)\n            journal_required = {"alpha_fidelity"}\n        else:\n            journal_source_rgb = rgba[:, :, :3].copy()\n            journal_required = set()\n''')

          # Required journal evidence must be measured on every stage where it is
          # applicable; missing applicable alpha/gradient still fails closed.
          replace('engine/app/transform_journal.py', '''    def _measure(self, data: bytes) -> dict[str, Any]:\n        sha = _sha(data)\n        capture_render = self._measurement_stage_id == "restore_source_dimensions"\n        measure_alpha = capture_render\n''', '''    def _measure(self, data: bytes) -> dict[str, Any]:\n        sha = _sha(data)\n        capture_render = (\n            self._measurement_stage_id == "restore_source_dimensions"\n            or "gradient_fidelity" in self.required_metrics\n        )\n        measure_alpha = "alpha_fidelity" in self.required_metrics\n''')

          # P0-D: continuous analytic paint has semantic region boundaries, not
          # palette-band boundaries. Map observable render clusters to semantic
          # labels without reconstructing absent source regions.
          replace('engine/regression/residual_semantic_geometry.py', '''def measure_alpha_support_geometry(\n''', '''def measure_continuous_semantic_geometry(\n    render_rgba: np.ndarray,\n    source_labels: np.ndarray,\n) -> dict[str, Any]:\n    source, rendered, mapping = map_continuous_hard_shapes(\n        render_rgba, source_labels, excluded_source_labels=(),\n    )\n    boundary = base._boundary_distance(\n        base._label_boundaries(source), base._label_boundaries(rendered)\n    )\n    topology = measure_label_topology(source, rendered)\n    topology["semantic_geometry_policy_version"] = SEMANTIC_GEOMETRY_POLICY_VERSION\n    topology["topology_observability"] = "continuous_semantic_regions"\n    return {\n        "component": base.connected_component_fidelity(source, rendered),\n        "boundary": boundary,\n        "topology": topology,\n        "mapping": mapping,\n        "topology_observability": "continuous_semantic_regions",\n    }\n\n\ndef measure_alpha_support_geometry(\n''')
          replace('engine/regression/residual_measurement_contract.py', '''    measure_alpha_support_geometry,\n    measure_continuous_hard_shape_components,\n)\n''', '''    measure_alpha_support_geometry,\n    measure_continuous_hard_shape_components,\n    measure_continuous_semantic_geometry,\n)\n''')
          replace('engine/regression/residual_measurement_contract.py', '''        elif builder_name == "_draw_transparent_overlap":\n''', '''        elif palette_mode == "continuous_analytic":\n            semantic = measure_continuous_semantic_geometry(rendered, source_labels)\n            result.update(semantic["component"])\n            result.update(semantic["boundary"])\n            result["topology"] = semantic["topology"]\n            semantic_meta.update(\n                {\n                    "overrides": ["component", "boundary", "topology"],\n                    "reason": "continuous paint bands are colour samples, not semantic shared boundaries",\n                    "mapping": semantic["mapping"],\n                    "topology_observability": semantic["topology_observability"],\n                }\n            )\n\n        elif builder_name == "_draw_transparent_overlap":\n''')

          # Regression controls: general ramp-vs-step detection, quality-safe winner,
          # downstream required metrics, continuous semantic topology positive control.
          p=Path('engine/test_analyzer_contracts.py')
          p.write_text(p.read_text()+'''\n\ndef test_continuous_paint_detector_separates_smooth_ramp_from_palette_steps() -> None:\n    ramp = np.full((256, 256, 4), 255, dtype=np.uint8)\n    ramp[48:208, 128:232, :3] = (35, 92, 220)\n    for x in range(24, 128):\n        t = (x - 24) / 103.0\n        ramp[48:208, x, :3] = np.rint(\n            np.asarray((225, 40, 35)) * (1.0 - t) + np.asarray((245, 188, 35)) * t\n        ).astype(np.uint8)\n    stepped = ramp.copy()\n    for index, x0 in enumerate(range(24, 128, 26)):\n        stepped[48:208, x0:min(128, x0 + 26), :3] = (225 + index * 5, 40 + index * 32, 35)\n    assert analyzer.detect_gradient_like_surface(Image.fromarray(ramp, "RGBA")) is True\n    assert analyzer.detect_gradient_like_surface(Image.fromarray(stepped, "RGBA")) is False\n''')

          p=Path('engine/test_transform_journal.py')
          p.write_text(p.read_text()+'''\n\ndef test_required_gradient_metric_is_measured_on_downstream_stage(tmp_path: Path) -> None:\n    from app.transform_journal import TransformJournal\n    parent = tmp_path / "gradient_parent.svg"\n    candidate = tmp_path / "gradient_candidate.svg"\n    gradient = _svg(\n        '<defs><linearGradient id="g"><stop offset="0" stop-color="#e3000b"/>'\n        '<stop offset="1" stop-color="#554bad"/></linearGradient></defs>'\n        '<rect x="24" y="24" width="80" height="80" fill="url(#g)"/>'\n    )\n    parent.write_bytes(gradient)\n    candidate.write_bytes(gradient.replace(b'</svg>', b'<metadata>same-render</metadata></svg>'))\n    journal = TransformJournal(parent, _square_source(), required_metrics={"gradient_fidelity"})\n    accepted, stage = journal.consider_candidate("boundary_refit", parent, candidate)\n    assert accepted == candidate\n    assert "required_metric_unmeasured" not in stage["reason_codes"]\n    assert "gradient_stage_metrics_incomplete" not in stage["reason_codes"]\n\n\ndef test_required_alpha_metric_is_measured_not_faked_on_downstream_stage(tmp_path: Path) -> None:\n    from app.transform_journal import TransformJournal\n    parent = tmp_path / "alpha_parent.svg"\n    candidate = tmp_path / "alpha_candidate.svg"\n    alpha_svg = _svg('<rect x="24" y="24" width="80" height="80" fill="#e3000b" fill-opacity="0.5"/>')\n    parent.write_bytes(alpha_svg)\n    candidate.write_bytes(alpha_svg.replace(b'</svg>', b'<metadata>same-alpha</metadata></svg>'))\n    journal = TransformJournal(parent, _square_source(), required_metrics={"alpha_fidelity"})\n    accepted, stage = journal.consider_candidate("boundary_refit", parent, candidate)\n    assert accepted == candidate\n    assert stage["alpha_comparison"] is not None\n    assert "alpha_stage_metrics_incomplete" not in stage["reason_codes"]\n\n\ndef test_winner_selection_filters_unsafe_candidates_and_fails_closed_when_none() -> None:\n    from app.pipeline_core import select_best\n    def candidate(name: str, fidelity: float, safe: bool):\n        return {\n            "name": name, "total_score": fidelity, "fidelity_score": fidelity,\n            "rendered_ok": True, "selection_safe": safe,\n            "selection_disqualified": not safe,\n            "score_details": {"path_count": 2, "edge_f1": 1.0, "has_bitmap": False},\n        }\n    chosen, _raw, _reason = select_best(\n        [candidate("unsafe", 99.0, False), candidate("safe", 95.0, True)], "logo_color"\n    )\n    assert chosen["name"] == "safe"\n    with pytest.raises(RuntimeError, match="no_selection_safe_candidate"):\n        select_best([candidate("unsafe", 99.0, False)], "logo_color")\n''')

          p=Path('engine/regression/test_residual_multiscale_source.py')
          text=p.read_text()
          marker='\nif __name__=="__main__": unittest.main()'
          addition='''\n\n    def test_continuous_analytic_palette_uses_semantic_shared_boundary(self):\n        builder=suite._BUILDER_BY_CASE["qa-hard-stop-gradient"]\n        scene=source.build_analytic_scene(builder,256)\n        rgba=np.asarray(scene.image.convert("RGBA"),dtype=np.uint8)\n        result=measurement.measure_residual_error(rgba,rgba.copy())\n        self.assertEqual(result["semantic_geometry"]["palette_mode"],"continuous_analytic")\n        self.assertEqual(result["source_component_recall"],1.0)\n        self.assertEqual(result["render_component_precision"],1.0)\n        self.assertEqual(result["min_component_iou"],1.0)\n        self.assertEqual(result["boundary_p95_px"],0.0)\n        self.assertEqual(result["topology"]["adjacency_loss_count"],0)\n        shared=result["topology"]["shared_boundary"]\n        self.assertTrue(shared["applicable"])\n        self.assertEqual(shared["max_gap_ratio"],0.0)\n        self.assertEqual(shared["max_overlap_ratio"],0.0)\n        self.assertEqual(shared["min_matched_transition_ratio"],1.0)\n'''
          if marker not in text: raise SystemExit('missing unittest marker')
          p.write_text(text.replace(marker,addition+marker,1))
          PY
          python -m py_compile engine/app/analyzer.py engine/app/pipeline_core.py engine/app/transform_journal.py engine/regression/residual_semantic_geometry.py engine/regression/residual_measurement_contract.py engine/test_analyzer_contracts.py engine/test_transform_journal.py engine/regression/test_residual_multiscale_source.py
      - name: Commit final patch and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-apply.yml
          git add engine/app/analyzer.py engine/app/pipeline_core.py engine/app/transform_journal.py engine/regression/residual_semantic_geometry.py engine/regression/residual_measurement_contract.py engine/test_analyzer_contracts.py engine/test_transform_journal.py engine/regression/test_residual_multiscale_source.py
          git commit -m "Fix gradient winner journal and shared-boundary closure"
          git push origin HEAD:codex/ai4-round3-gradient-topology
