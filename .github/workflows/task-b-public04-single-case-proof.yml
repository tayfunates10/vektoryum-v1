name: Task B public-04 single-case production proof

on:
  pull_request:
    paths:
      - ".github/workflows/task-b-public04-single-case-proof.yml"

permissions:
  contents: read
  actions: read

jobs:
  public04:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: engine
      VEKTORYUM_WORKERS: "1"
      PINNED_ARTIFACT_ID: "8354853386"
      PINNED_ARTIFACT_SHA256: "a8be8c0782a8aeb037a2736de8adbd357c5074ad0da6355562e2543092d6af76"
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install system validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript libcairo2

      - name: Install production dependencies
        run: python -m pip install -r engine/requirements.txt pytest httpx

      - name: Restore SHA-pinned immutable RFV corpus
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/task-b-public04"
          mkdir -p "${ROOT}/input"
          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            --output "${ROOT}/pinned.zip"

          ROOT="${ROOT}" python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          archive = root / "pinned.zip"
          payload = archive.read_bytes()
          expected = os.environ["PINNED_ARTIFACT_SHA256"]
          assert hashlib.sha256(payload).hexdigest() == expected
          required = {
              "rfv2-public-corpus.tar.gz",
              "bundle-checksums.json",
          }
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              assert required.issubset(names)
              for name in sorted(required):
                  data = package.read(name)
                  (root / "input" / name).write_bytes(data)
          PY

      - name: Verify corpus identity and prepare outside repository
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/task-b-public04"
          python -m engine.regression.rfv3_live_prepare \
            --bundle "${ROOT}/input/rfv2-public-corpus.tar.gz" \
            --checksums "${ROOT}/input/bundle-checksums.json" \
            --destination "${ROOT}/corpus" \
            --evidence-out "${ROOT}/prepare-evidence.json"

      - name: Measure qualification-public-04 through production pipeline
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/task-b-public04"
          cat > "${ROOT}/run_public04.py" <<'PY'
          import json
          import os
          from pathlib import Path

          from engine.regression.rfv3_measurement_runner import (
              POLICY_PATH,
              load_json,
              load_qualification_cases,
              run_repeated_case,
              validate_policy,
          )

          def main() -> None:
              root = Path(os.environ["ROOT"])
              corpus = root / "corpus"
              policy = validate_policy(load_json(POLICY_PATH))
              cases = load_qualification_cases(corpus)
              selected = [
                  case
                  for case in cases
                  if case.case_id == "qualification-public-04"
              ]
              assert len(selected) == 1
              result, audit = run_repeated_case(
                  selected[0],
                  corpus_root=corpus,
                  work_root=root / "work" / selected[0].case_id,
                  engine_version=os.environ["HEAD_SHA"],
                  repeat_count=policy["repeat_count"],
                  timeout_seconds=policy["repeat_timeout_seconds"],
                  max_transient_retries=policy["max_transient_retries_per_repeat"],
              )
              payload = {
                  "schema": "vektoryum-task-b-public04-proof-v1",
                  "result": result.to_dict(),
                  "audit": audit,
              }
              (root / "public04-result.json").write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(payload, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY
          ROOT="${ROOT}" python "${ROOT}/run_public04.py" 2>&1 | tee "${ROOT}/public04.log"

      - name: Upload public-04 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-b-public04-proof-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/task-b-public04/public04-result.json
            ${{ runner.temp }}/task-b-public04/public04.log
            ${{ runner.temp }}/task-b-public04/prepare-evidence.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
