name: Issue153 manager remediation pass 1

on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
    paths: [.github/workflows/issue153-manager-remediation-pass1.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply manager remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Exact Final remediation: restore the required-base bounded alpha-parent
          # applicability. Trial count and all alpha quality gates remain unchanged.
          p = Path('engine/app/alpha_parent_selection.py')
          s = p.read_text()
          if '_MAX_ALPHA_LEVELS = 4' not in s:
              s = s.replace('_MAX_TRIALS = 4\n', '_MAX_ALPHA_LEVELS = 4\n_MAX_TRIALS = 4\n', 1)
          s, n = re.subn(
              r'(?m)^    if len\(levels\) <= 1:\s*$',
              '    if len(levels) <= 1 or len(levels) > _MAX_ALPHA_LEVELS:',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'alpha applicability replacement count={n}')
          p.write_text(s)

          # Preserve Round-3 downstream gradient measurement while restoring the
          # base fail-closed scope for alpha-only downstream mutations.
          p = Path('engine/app/transform_journal.py')
          s = p.read_text()
          old = '        measure_alpha = "alpha_fidelity" in self.required_metrics\n'
          if old not in s:
              raise SystemExit('journal alpha anchor missing')
          p.write_text(s.replace(
              old,
              '        measure_alpha = capture_render and "alpha_fidelity" in self.required_metrics\n',
              1,
          ))

          # The Issue-153 local continuous-paint fallback is intentionally an opaque
          # source fallback. Transparent gradients keep the pre-existing global signal
          # and alpha pipeline; this avoids expanding their candidate graph/perf cost.
          p = Path('engine/app/analyzer.py')
          s = p.read_text()
          fn = s.index('def detect_gradient_like_surface')
          legacy = s.index('    if unique_ratio > 0.095 and smooth_area_ratio > 0.68:', fn)
          insertion = s.index('    h, w = arr.shape[:2]', legacy)
          guard = (
              '    # Transparent sources already have a dedicated alpha reconstruction path.\n'
              '    # Do not let the new local fallback alone expand their candidate graph.\n'
              '    if bool(np.any(alpha < 255)):\n'
              '        return False\n\n'
          )
          if guard not in s:
              s = s[:insertion] + guard + s[insertion:]
          p.write_text(s)

          # Regression contracts: alpha-only downstream stages must remain fail-closed;
          # gradient-required downstream stages continue to measure real render evidence.
          p = Path('engine/test_transform_journal.py')
          s = p.read_text()
          s = s.replace(
              'def test_alpha_required_measurement_runs_on_downstream_stage(',
              'def test_alpha_only_measurement_remains_scoped_to_source_dimension_restore(',
              1,
          )
          pattern = re.compile(
              r'(def test_alpha_only_measurement_remains_scoped_to_source_dimension_restore\([\s\S]*?'
              r'accepted, stage = journal\.consider_candidate\("boundary_refit", parent, candidate\)\n)'
              r'[\s\S]*?(?=\n\ndef test_alpha_restore_reuses_single_rgba_render_per_artifact)',
          )
          repl = r'''\1
    assert accepted == parent
    assert stage["status"] == "rolled_back"
    assert "required_metric_unmeasured" in stage["reason_codes"]
    assert "alpha_stage_metrics_incomplete" in stage["reason_codes"]
    assert stage["required_unmeasured"] == ["alpha_fidelity"]
    assert stage["alpha_comparison"] is None
'''
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit(f'alpha journal regression replacement count={n}')

          pattern = re.compile(
              r'def test_required_alpha_metric_is_measured_not_faked_on_downstream_stage\(tmp_path: Path\) -> None:'
              r'[\s\S]*?(?=\n\ndef test_winner_selection_filters_unsafe_when_safe_exists_and_preserves_no_safe_fallback)',
          )
          repl = '''def test_required_alpha_metric_is_not_faked_on_downstream_stage(tmp_path: Path) -> None:
    from app.transform_journal import TransformJournal
    parent = tmp_path / "alpha_parent.svg"
    candidate = tmp_path / "alpha_candidate.svg"
    alpha_svg = _svg('<rect x="24" y="24" width="80" height="80" fill="#e3000b" fill-opacity="0.5"/>')
    parent.write_bytes(alpha_svg)
    candidate.write_bytes(alpha_svg.replace(b'</svg>', b'<metadata>same-alpha</metadata></svg>'))
    journal = TransformJournal(parent, _square_source(), required_metrics={"alpha_fidelity"})
    accepted, stage = journal.consider_candidate("boundary_refit", parent, candidate)
    assert accepted == parent
    assert stage["alpha_comparison"] is None
    assert "required_metric_unmeasured" in stage["reason_codes"]
    assert "alpha_stage_metrics_incomplete" in stage["reason_codes"]
'''
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit(f'extra alpha regression replacement count={n}')
          p.write_text(s)
          PY
      - name: Compile changed modules
        run: python -m py_compile engine/app/analyzer.py engine/app/alpha_parent_selection.py engine/app/transform_journal.py engine/test_transform_journal.py
      - name: Run focused contracts
        run: python -m pytest -q engine/test_analyzer_contracts.py engine/test_transform_journal.py engine/test_ai2_component_quality.py
      - name: Commit remediation and self-delete runner
        shell: bash
        run: |
          git config user.name 'chatgpt-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/issue153-manager-remediation-pass1.yml
          git add engine/app/analyzer.py engine/app/alpha_parent_selection.py engine/app/transform_journal.py engine/test_transform_journal.py
          git commit -m 'fix: remediate issue153 cross-corpus regressions'
          git push origin HEAD:codex/ai4-round3-gradient-topology
