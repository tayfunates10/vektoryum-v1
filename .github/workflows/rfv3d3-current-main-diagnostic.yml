name: RFV-3D3 current-main diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-current-main-diagnostic.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: rfv3d3-current-main-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  VEKTORYUM_WORKERS: "1"
  VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PINNED_ARTIFACT_ID: "8630061266"
  PINNED_ARTIFACT_DIGEST: "sha256:ded13a91be73fc00482f7d1f47404b1b4e08b000dc3ededadf58bdd59a2f6b33"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove production and measurement trees equal current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" "${VALIDATION_SHA}"
          git diff --quiet "${BASE_SHA}" "${VALIDATION_SHA}" -- \
            engine/app \
            engine/benchmark \
            engine/requirements.txt \
            engine/regression/rfv2_live_acquire.py \
            engine/regression/rfv2_live_bundle.py \
            engine/regression/rfv2_manifest_assembler.py \
            engine/regression/rfv3_live_measurement.py \
            engine/regression/rfv3_live_prepare.py \
            engine/regression/rfv3_measurement_runner.py \
            engine/regression/rfv3_measurement_policy.json
          mkdir -p diagnostic-identity
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def tree(ref: str, path: str) -> str:
              return subprocess.check_output(
                  ["git", "rev-parse", f"{ref}:{path}"], text=True
              ).strip()

          paths = [
              "engine/app",
              "engine/benchmark",
              "engine/requirements.txt",
              "engine/regression/rfv3_live_measurement.py",
              "engine/regression/rfv3_live_prepare.py",
              "engine/regression/rfv3_measurement_runner.py",
              "engine/regression/rfv3_measurement_policy.json",
          ]
          identity = {
              "schema": "vektoryum-rfv3d3-current-main-identity-v1",
              "base_sha": os.environ["BASE_SHA"],
              "validation_sha": os.environ["VALIDATION_SHA"],
              "base_is_ancestor": True,
              "production_and_measurement_tree_equal_to_base": True,
              "path_identities": {
                  path: {
                      "base": tree(os.environ["BASE_SHA"], path),
                      "validation": tree(os.environ["VALIDATION_SHA"], path),
                  }
                  for path in paths
              },
              "release_state": "RFV-3 pending / NO-GO / rfv4_allowed=false",
          }
          assert all(
              item["base"] == item["validation"]
              for item in identity["path_identities"].values()
          )
          encoded = (json.dumps(identity, indent=2, sort_keys=True) + "\n").encode()
          Path("diagnostic-identity/baseline-identity.json").write_bytes(encoded)
          Path("diagnostic-identity/baseline-identity.sha256").write_text(
              hashlib.sha256(encoded).hexdigest() + "\n", encoding="utf-8"
          )
          PY
      - name: Validate measurement contracts
        env:
          PYTHONPATH: engine
        run: |
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless scipy defusedxml
          python -m py_compile \
            engine/regression/rfv3_live_measurement.py \
            engine/regression/rfv3_live_prepare.py \
            engine/regression/test_rfv3_live_measurement.py \
            engine/regression/test_rfv3_live_prepare.py
          python -m unittest \
            engine.regression.test_rfv3_live_measurement \
            engine.regression.test_rfv3_live_prepare
      - uses: actions/upload-artifact@v4
        with:
          name: rfv3d3-baseline-identity-${{ env.VALIDATION_SHA }}
          path: diagnostic-identity
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  acquire:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download immutable reviewed RFV-2 corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rfv3d3-source"
          mkdir -p "${root}/out"
          curl --fail-with-body --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}" \
            --output "${root}/artifact-metadata.json"
          curl --fail-with-body --location --silent --show-error --retry 3 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            --output "${root}/corpus.zip"
          RFV_ROOT="${root}" python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["RFV_ROOT"])
          metadata = json.loads((root / "artifact-metadata.json").read_text())
          assert metadata["id"] == int(os.environ["PINNED_ARTIFACT_ID"])
          assert metadata["name"].startswith("rfv2-public-qualification-corpus-")
          assert metadata["expired"] is False
          assert metadata["size_in_bytes"] == 10910811
          assert metadata["digest"] == os.environ["PINNED_ARTIFACT_DIGEST"]

          expected = {
              "rfv2-public-corpus.tar.gz": "1da641ad27b58985e4e1cf8d9972af5a15f5105e85e2c319151a5e373b6afc46",
              "qualification-manifest.json": "c2b1f4381d4ac9cd96e1ce8ba27589103a3ee696838dbf3dc487db96e51130aa",
              "qualification-audit.json": "cf42d7d4fb820c915a2023b242c10a54e21ca87c721f9b699d55d6a49bb0c0f0",
              "bundle-checksums.json": "ff39ab6e320dbede7241ceefa9eea87d31c3b4e52bb31366aa49278067826655",
          }
          output = root / "out"
          with zipfile.ZipFile(root / "corpus.zip") as package:
              infos = package.infolist()
              assert {item.filename for item in infos} == set(expected)
              for info in infos:
                  assert PurePosixPath(info.filename).name == info.filename
                  assert not info.is_dir()
                  assert not (info.flag_bits & 0x1)
                  mode = (info.external_attr >> 16) & 0o170000
                  assert mode in (0, stat.S_IFREG)
                  payload = package.read(info)
                  assert hashlib.sha256(payload).hexdigest() == expected[info.filename]
                  (output / info.filename).write_bytes(payload)

          checksums = json.loads((output / "bundle-checksums.json").read_text())
          manifest = json.loads((output / "qualification-manifest.json").read_text())
          audit = json.loads((output / "qualification-audit.json").read_text())
          assert checksums["qualified_case_count"] == 24
          assert checksums["cases_sha256"] == "5f151a6cb1a433b0cb0989a67bd7cc7940162f4b36d67903d6ccdd173f9e7d89"
          assert manifest["status"] == "qualified"
          assert manifest["qualified_case_count"] == 24
          assert audit["complete"] is True
          assert audit["qualified_case_count"] == 24
          assert audit["missing_categories"] == []
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rfv3d3-corpus-${{ env.VALIDATION_SHA }}
          path: |
            ${{ runner.temp }}/rfv3d3-source/out/rfv2-public-corpus.tar.gz
            ${{ runner.temp }}/rfv3d3-source/out/bundle-checksums.json
            ${{ runner.temp }}/rfv3d3-source/artifact-metadata.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  measure:
    needs: [contract, acquire]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libcairo2
          python -m pip install -r engine/requirements.txt pytest httpx
      - uses: actions/download-artifact@v4
        with:
          name: rfv3d3-corpus-${{ env.VALIDATION_SHA }}
          path: ${{ runner.temp }}/rfv3d3-input
      - name: Safely prepare corpus
        run: |
          set -o pipefail
          python -m engine.regression.rfv3_live_prepare \
            --bundle "${RUNNER_TEMP}/rfv3d3-input/rfv2-public-corpus.tar.gz" \
            --checksums "${RUNNER_TEMP}/rfv3d3-input/bundle-checksums.json" \
            --destination "${RUNNER_TEMP}/rfv3d3-corpus" \
            --evidence-out "${RUNNER_TEMP}/rfv3d3-prepare-${{ matrix.shard }}.json" \
            2>&1 | tee "${RUNNER_TEMP}/rfv3d3-extract-${{ matrix.shard }}.log"
      - name: Measure production shard three times
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/rfv3d3-shard-${{ matrix.shard }}"
          python -m engine.regression.rfv3_live_measurement shard \
            --corpus-root "${RUNNER_TEMP}/rfv3d3-corpus" \
            --output "${RUNNER_TEMP}/rfv3d3-shard-${{ matrix.shard }}" \
            --engine-version "${VALIDATION_SHA}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 6 \
            2>&1 | tee "${RUNNER_TEMP}/rfv3d3-shard-${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfv3d3-shard-${{ matrix.shard }}-${{ env.VALIDATION_SHA }}
          path: |
            ${{ runner.temp }}/rfv3d3-prepare-${{ matrix.shard }}.json
            ${{ runner.temp }}/rfv3d3-shard-${{ matrix.shard }}/pipeline-results.json
            ${{ runner.temp }}/rfv3d3-shard-${{ matrix.shard }}/retry-audit.json
            ${{ runner.temp }}/rfv3d3-shard-${{ matrix.shard }}/shard-summary.json
            ${{ runner.temp }}/rfv3d3-shard-${{ matrix.shard }}.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  aggregate:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aggregate dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless scipy defusedxml
      - uses: actions/download-artifact@v4
        with:
          pattern: rfv3d3-shard-*-${{ env.VALIDATION_SHA }}
          path: ${{ runner.temp }}/rfv3d3-shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: rfv3d3-baseline-identity-${{ env.VALIDATION_SHA }}
          path: ${{ runner.temp }}/rfv3d3-identity
      - name: Aggregate exact 24-case evidence
        run: |
          set -o pipefail
          python -m engine.regression.rfv3_live_measurement aggregate \
            --input-root "${RUNNER_TEMP}/rfv3d3-shards" \
            --output "${RUNNER_TEMP}/rfv3d3-final" \
            --engine-version "${VALIDATION_SHA}" \
            --shard-count 6 \
            2>&1 | tee "${RUNNER_TEMP}/rfv3d3-aggregate.log"
      - name: Build worst-case structural ranking
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "rfv3d3-final"
          results = json.loads((root / "pipeline-results.json").read_text())
          retry = json.loads((root / "retry-audit.json").read_text())
          envelope = json.loads((root / "measurement-envelope.json").read_text())
          identity = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "rfv3d3-identity" / "baseline-identity.json").read_text()
          )
          assert results["case_count"] == 24
          assert len(results["results"]) == 24
          assert retry["completed_case_count"] == 24
          assert retry["sample_count"] == 72
          assert envelope["case_count"] == 24
          assert envelope["repeat_sample_count"] == 72
          assert envelope["raw_assets_in_repository"] is False
          assert identity["production_and_measurement_tree_equal_to_base"] is True

          rows = []
          for item in results["results"]:
              metrics = item["metrics"]
              for value in metrics.values():
                  assert value is None or (
                      not isinstance(value, bool) and math.isfinite(float(value))
                  )
              edge = metrics.get("edge_f1")
              ssim = metrics.get("ssim")
              structural = None
              if edge is not None and ssim is not None:
                  structural = 0.55 * float(edge) + 0.45 * float(ssim)
              rows.append({
                  "case_id": item["case_id"],
                  "artifact_sha256": item["artifact_sha256"],
                  "failure": item["failure"],
                  "fidelity": metrics.get("fidelity"),
                  "edge_f1": edge,
                  "ssim": ssim,
                  "alpha_iou": metrics.get("alpha_iou"),
                  "delta_e00": metrics.get("delta_e00"),
                  "path_count": metrics.get("path_count"),
                  "svg_bytes": metrics.get("svg_bytes"),
                  "structural_score_55_edge_45_ssim": structural,
              })

          def ascending(key):
              return sorted(rows, key=lambda row: (row[key] is None, row[key] if row[key] is not None else 1e9))

          ranking = {
              "schema": "vektoryum-rfv3d3-current-main-ranking-v1",
              "base_sha": identity["base_sha"],
              "validation_sha": identity["validation_sha"],
              "production_and_measurement_tree_equal_to_base": True,
              "case_count": 24,
              "repeat_sample_count": 72,
              "ranking_formula": "0.55 * edge_f1 + 0.45 * ssim; lower is worse",
              "worst_by_fidelity": ascending("fidelity")[:10],
              "worst_by_edge_f1": ascending("edge_f1")[:10],
              "worst_by_ssim": ascending("ssim")[:10],
              "worst_by_structural_score": ascending("structural_score_55_edge_45_ssim")[:10],
              "release_state": "RFV-3 pending / NO-GO / rfv4_allowed=false",
          }
          encoded = (json.dumps(ranking, indent=2, sort_keys=True) + "\n").encode()
          (root / "rfv3d3-ranking.json").write_bytes(encoded)
          (root / "rfv3d3-ranking.sha256").write_text(
              hashlib.sha256(encoded).hexdigest() + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rfv3d3-current-main-measurement-${{ env.VALIDATION_SHA }}
          path: |
            ${{ runner.temp }}/rfv3d3-final/pipeline-results.json
            ${{ runner.temp }}/rfv3d3-final/retry-audit.json
            ${{ runner.temp }}/rfv3d3-final/measurement-envelope.json
            ${{ runner.temp }}/rfv3d3-final/rfv3d3-ranking.json
            ${{ runner.temp }}/rfv3d3-final/rfv3d3-ranking.sha256
            ${{ runner.temp }}/rfv3d3-identity/baseline-identity.json
            ${{ runner.temp }}/rfv3d3-identity/baseline-identity.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
