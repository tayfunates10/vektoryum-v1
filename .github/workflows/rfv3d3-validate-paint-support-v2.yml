name: RFV-3D3 validate fail-closed painter paint support v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-validate-paint-support-v2.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: rfv3d3-paint-support-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: engine:.
      VEKTORYUM_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Apply exact fail-closed transformation
        run: python .github/rfv3d3_apply_paint_support.py

      - name: Install production and validation dependencies
        run: python -m pip install -q -r engine/requirements.txt pytest PyYAML

      - name: Compile changed production and contract files
        run: |
          python -m py_compile \
            engine/app/alpha_candidate_painter.py \
            engine/app/transform_journal.py \
            engine/test_rfv3d3_source_alpha_journal.py \
            .github/rfv3d3_apply_paint_support.py

      - name: Validate workflow YAML and extract historical RFV-3D2 test command
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          workflow_paths = (
              Path('.github/workflows/real-world-fidelity-rfv3d2-alpha-mask-fix.yml'),
              Path('.github/workflows/real-world-fidelity-rfv3e-viewbox-fix.yml'),
              Path('.github/workflows/real-world-fidelity-rfv3b-live.yml'),
          )
          for path in workflow_paths:
              document = yaml.safe_load(path.read_text())
              assert isinstance(document, dict), path
              assert isinstance(document.get('jobs'), dict), path

          rfv3d2 = yaml.safe_load(workflow_paths[0].read_text())
          steps = rfv3d2['jobs']['contract']['steps']
          historical = next(
              step for step in steps
              if step.get('name') == 'Run alpha-mask unit and production integration tests'
          )
          Path('/tmp/rfv3d2-alpha-tests.sh').write_text(historical['run'])
          PY
          bash -n /tmp/rfv3d2-alpha-tests.sh

      - name: Run complete historical RFV-3D2 alpha suite
        run: bash /tmp/rfv3d2-alpha-tests.sh

      - name: Run RFV-3D3 source-alpha and journal contracts
        run: |
          pytest -q \
            engine/test_rfv3d3_source_alpha_journal.py \
            engine/test_alpha_candidate_validation.py \
            engine/test_transform_journal.py

      - name: Verify narrow final diff scope and immutable policies
        run: |
          git fetch origin "${{ github.base_ref }}"
          python - <<'PY'
          import subprocess

          expected = {
              '.github/rfv3d3_apply_paint_support.py',
              '.github/workflows/rfv3d3-validate-paint-support.yml',
              '.github/workflows/rfv3d3-validate-paint-support-v2.yml',
              '.github/workflows/real-world-fidelity-rfv3b-live.yml',
              '.github/workflows/real-world-fidelity-rfv3d2-alpha-mask-fix.yml',
              '.github/workflows/real-world-fidelity-rfv3e-viewbox-fix.yml',
              'engine/app/alpha_candidate_painter.py',
              'engine/app/alpha_candidate_validation.py',
              'engine/app/alpha_soft_ellipse.py',
              'engine/app/transform_journal.py',
              'engine/test_rfv3d3_source_alpha_journal.py',
          }
          output = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main', '--'], text=True
          )
          actual = {line for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  f'unexpected diff scope: missing={sorted(expected-actual)} '
                  f'extra={sorted(actual-expected)}'
              )
          PY
          git diff --exit-code origin/main -- \
            engine/app/final_artifact_evaluator.py \
            engine/app/source_truth.py \
            engine/benchmark \
            engine/regression/rfv3_measurement_policy.json \
            engine/regression/rfv2_qualification_manifest.json \
            docs/real_world_fidelity/evidence/rfv3_quality_decision.json \
            docs/real_world_fidelity_roadmap.json

      - name: Confirm release remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap = json.loads(Path('docs/real_world_fidelity_roadmap.json').read_text())
          decision = json.loads(
              Path('docs/real_world_fidelity/evidence/rfv3_quality_decision.json').read_text()
          )
          assert roadmap['phases'][2]['status'] == 'pending'
          assert roadmap['phases'][3]['status'] == 'pending'
          assert decision['release_decision'] == 'no_go'
          assert decision['rfv4_allowed'] is False
          PY

      - name: Materialize exact validated Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          paths = (
              Path('engine/app/alpha_candidate_painter.py'),
              Path('engine/app/transform_journal.py'),
              Path('engine/test_rfv3d3_source_alpha_journal.py'),
              Path('.github/workflows/real-world-fidelity-rfv3d2-alpha-mask-fix.yml'),
          )
          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          destination = Path('/tmp/rfv3d3-paint-support')
          destination.mkdir(parents=True, exist_ok=True)
          blob_shas = {}
          file_shas = {}
          for path in paths:
              data = path.read_bytes()
              file_shas[str(path)] = hashlib.sha256(data).hexdigest()
              payload = json.dumps({
                  'content': base64.b64encode(data).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob_shas[str(path)] = json.load(response)['sha']
              output = destination / path
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
          (destination / 'blob-shas.json').write_text(
              json.dumps(blob_shas, indent=2, sort_keys=True) + '\n'
          )
          (destination / 'sha256.json').write_text(
              json.dumps(file_shas, indent=2, sort_keys=True) + '\n'
          )
          print((destination / 'blob-shas.json').read_text())
          PY

      - name: Upload validated paint-support files
        uses: actions/upload-artifact@v4
        with:
          name: rfv3d3-validated-paint-support-v2-${{ github.event.pull_request.head.sha }}
          path: /tmp/rfv3d3-paint-support
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
