name: tmp-p175-journal-first-risk

on:
  push:
    branches:
      - codex/tmp-p175-journal-first-risk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact journal-first edge-cleanup patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('engine/app/pipeline.py')
          text = path.read_text(encoding='utf-8')
          old = '''                try:\n                    cleaned = {**best, "svg_path": ec_dst}\n                    rescored = score_candidate(\n                        cleaned, original_path, analysis, mode_used,\n                        render_fn=edge_render_fn,\n                    )\n                    edge_candidate = rescored if rescored is not None else cleaned\n                    accepted_path, ec_stage = journal.consider_candidate(\n                        "edge_cleanup", src_svg, ec_dst, transform_report=ec_rep,\n                        render_fn=edge_render_fn,\n                    )\n                    if accepted_path == ec_dst:\n                        best = edge_candidate\n                        selection_reason = f"{selection_reason}+edge_cleanup"\n                    else:\n                        ec_rep = {**ec_rep, "applied": False,\n                                  "journal_status": ec_stage["status"],\n                                  "journal_reasons": ec_stage["reason_codes"]}\n'''
          new = '''                try:\n                    accepted_path, ec_stage = journal.consider_candidate(\n                        "edge_cleanup", src_svg, ec_dst, transform_report=ec_rep,\n                        render_fn=edge_render_fn,\n                    )\n                    if accepted_path == ec_dst:\n                        cleaned = {**best, "svg_path": ec_dst}\n                        rescored = score_candidate(\n                            cleaned, original_path, analysis, mode_used,\n                            render_fn=edge_render_fn,\n                        )\n                        edge_candidate = rescored if rescored is not None else cleaned\n                        best = edge_candidate\n                        selection_reason = f"{selection_reason}+edge_cleanup"\n                    else:\n                        ec_rep = {**ec_rep, "applied": False,\n                                  "journal_status": ec_stage["status"],\n                                  "journal_reasons": ec_stage["reason_codes"]}\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one edge_cleanup block, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile engine/app/pipeline.py
          python - <<'PY'
          from pathlib import Path
          text = Path('engine/app/pipeline.py').read_text(encoding='utf-8')
          start = text.index('                try:\n                    accepted_path, ec_stage = journal.consider_candidate(\n                        "edge_cleanup"')
          end = text.index('                finally:', start)
          block = text[start:end]
          assert block.index('journal.consider_candidate') < block.index('score_candidate')
          accepted = block.index('if accepted_path == ec_dst:')
          rejected = block.index('else:', accepted)
          assert 'score_candidate' in block[accepted:rejected]
          assert 'score_candidate' not in block[rejected:]
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/tmp-p175-journal-first-risk.yml
          git add engine/app/pipeline.py .github/workflows/tmp-p175-journal-first-risk.yml
          git commit -m "perf: journal-gate edge cleanup before rescore"
          git push origin HEAD:codex/tmp-p175-journal-first-risk
