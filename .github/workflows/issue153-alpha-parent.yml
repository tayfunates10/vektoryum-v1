name: Issue 153 alpha parent generalization
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Generalize bounded parent trials to continuous alpha
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/app/alpha_parent_selection.py')
          text=p.read_text()
          text=text.replace('_MAX_ALPHA_LEVELS = 4\n','')
          old='''    if len(levels) <= 1 or len(levels) > _MAX_ALPHA_LEVELS:\n        return result\n'''
          new='''    # Parent probing is bounded by _MAX_TRIALS, not by the number of source\n    # alpha levels. Continuous/anti-aliased alpha still uses the exact same\n    # source-alpha reconstruction gates; only opaque sources are inapplicable.\n    if len(levels) <= 1:\n        return result\n'''
          if old not in text: raise SystemExit('alpha-level gate anchor missing')
          p.write_text(text.replace(old,new,1))

          t=Path('engine/test_issue153_post_refit_contract.py')
          t.write_text(t.read_text()+'''\n\ndef test_alpha_parent_selection_has_no_source_level_count_ceiling() -> None:\n    source = __import__("inspect").getsource(\n        __import__("app.alpha_parent_selection", fromlist=["_select"])._select\n    )\n    assert "len(levels) >" not in source\n    assert "len(levels) <= 1" in source\n''')
          PY
          python -m py_compile engine/app/alpha_parent_selection.py engine/test_issue153_post_refit_contract.py
      - name: Run focused contracts
        working-directory: engine
        run: python -m pytest -q test_issue153_post_refit_contract.py test_transform_journal.py test_analyzer_contracts.py test_ai2_component_quality.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-alpha-parent.yml
          git add engine/app/alpha_parent_selection.py engine/test_issue153_post_refit_contract.py
          git commit -m "Generalize bounded alpha parent trials to continuous alpha"
          git push origin HEAD:codex/ai4-round3-gradient-topology
