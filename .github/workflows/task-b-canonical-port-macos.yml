name: Task B canonical port macOS

on:
  push:
    branches:
      - codex/task-b-public04-evaluator-aligned-rfv3b

permissions:
  contents: write

jobs:
  port-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install production test dependencies
        run: |
          brew install cairo ghostscript
          python -m pip install -r engine/requirements.txt

      - name: Apply narrow terminal hook without modifying existing phases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/app/alpha_candidate_painter.py")
          text = path.read_text(encoding="utf-8")

          old_phase = "\n".join(
              [
                  "        if winner is None and _node_free_polygon_retry_eligible(attempts):",
                  "            # Kesin eklemeli son çare: mevcut tüm aday yolları önce aynen",
                  "            # tüketilir; bugün winner üreten hiçbir vaka bu fazı görmez.",
                  "            winner = _evaluate_node_free_quantized()",
              ]
          )
          new_phase = "\n".join(
              [
                  "        if winner is None and _node_free_polygon_retry_eligible(attempts):",
                  "            # Kesin eklemeli son çare: mevcut tüm aday yolları önce aynen",
                  "            # tüketilir; bugün winner üreten hiçbir vaka bu fazı görmez.",
                  "            winner = _evaluate_node_free_quantized()",
                  "        if winner is None:",
                  "            # GÖREV B / public-04 — terminal ve kesin eklemeli retry. Mevcut",
                  "            # polygon/rect/contour, contour-q, paint-deficit q24/q20/q16/q12/q8",
                  "            # ve node-free polygon-q yollarının TAMAMI önce değişmeden çalışır.",
                  "            # Yalnız FinalArtifactEvaluator'da alpha-only reddedilmiş mevcut",
                  "            # paint-deficit etiketleri evaluator'ın fresh-render gridinde tekrar",
                  "            # kurulur; kabul yine aynı evaluator + TransformJournal kapılarındadır.",
                  "            from app.alpha_candidate_evaluator_retry import (  # noqa: PLC0415",
                  "                evaluate_evaluator_aligned_paint_deficit,",
                  "            )",
                  "",
                  "            winner = evaluate_evaluator_aligned_paint_deficit(",
                  "                attempts=attempts,",
                  "                original_root=original_root,",
                  "                canvas=canvas,",
                  "                source_rgba_full=source_rgba_full,",
                  "                parent_sha256=parent_sha256,",
                  "                mode=mode,",
                  "                parent_counts=parent_counts,",
                  "                limits=limits,",
                  "                target=target,",
                  "                excluded_from_parent=excluded_from_parent,",
                  "                parent_journal_path=parent_journal_path,",
                  "                journal_source_rgb=journal_source_rgb,",
                  "                journal_image_class=journal_image_class,",
                  "                write_tree_to_temp=_write_tree_to_temp,",
                  "                assess_candidate=_assess_painter_candidate,",
                  "                run_geometry_journal=_run_painter_geometry_journal,",
                  "            )",
              ]
          )
          if text.count(old_phase) != 1:
              raise SystemExit(f"terminal phase anchor count={text.count(old_phase)}")
          text = text.replace(old_phase, new_phase, 1)

          old_grid = "\n".join(
              [
                  '            "painter_grid_width": int(grid_width),',
                  '            "painter_grid_height": int(grid_height),',
              ]
          )
          new_grid = "\n".join(
              [
                  '            "painter_grid_width": int(',
                  '                w_geometry.get("evaluator_aligned_grid_width", grid_width)',
                  '            ),',
                  '            "painter_grid_height": int(',
                  '                w_geometry.get("evaluator_aligned_grid_height", grid_height)',
                  '            ),',
              ]
          )
          if text.count(old_grid) != 1:
              raise SystemExit(f"result grid anchor count={text.count(old_grid)}")
          text = text.replace(old_grid, new_grid, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile Task B production modules
        run: |
          python -m py_compile \
            engine/app/alpha_candidate_painter.py \
            engine/app/alpha_candidate_evaluator_retry.py \
            engine/test_alpha_painter_evaluator_aligned_retry.py

      - name: Run frozen painter contracts and Task B tests
        run: |
          python -m unittest \
            engine.test_alpha_painter_evaluator_aligned_retry \
            engine.test_alpha_painter_ledger \
            engine.test_alpha_painter_stroke_continuation \
            engine.test_alpha_painter_cumulative_levels \
            engine.test_alpha_painter_polygon_quantized_retry -v

      - name: Commit production hook only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-b-canonical-port.yml
          git rm .github/workflows/task-b-canonical-port-macos.yml
          git add engine/app/alpha_candidate_painter.py
          git diff --cached --check
          git commit -m "fix(alpha): add evaluator-aligned terminal painter retry"
          git push origin HEAD:codex/task-b-public04-evaluator-aligned-rfv3b
