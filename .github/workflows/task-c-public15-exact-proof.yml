name: Task C public-15 exact-color proof

on:
  push:
    branches:
      - codex/task-c-public15-exact-proof

permissions:
  contents: read
  actions: read

jobs:
  public15-proof:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: engine
      VEKTORYUM_WORKERS: "1"
      TASK_HEAD_SHA: "93bf46336c3bd016ee7ba0625a761407a30b8e8a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install production Python dependencies
        working-directory: engine
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Download exact PR 158 RFV-3B corpus
        uses: actions/download-artifact@v4
        with:
          name: rfv3b-corpus-98361c24ac3846532c689e411b40c2c9a8db0a72
          path: ${{ runner.temp }}/rfv3b-input
          github-token: ${{ github.token }}
          repository: tayfunates10/vektoryum-v1
          run-id: 31849174384
      - name: Verify and prepare immutable corpus
        run: |
          python -m engine.regression.rfv3_live_prepare \
            --bundle "${RUNNER_TEMP}/rfv3b-input/rfv2-public-corpus.tar.gz" \
            --checksums "${RUNNER_TEMP}/rfv3b-input/bundle-checksums.json" \
            --destination "${RUNNER_TEMP}/rfv3b-corpus" \
            --evidence-out "${RUNNER_TEMP}/public15-prepare.json"
      - name: Run public-15 once through final production pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/public15-work"
          RFV_CORPUS="${RUNNER_TEMP}/rfv3b-corpus" \
          RFV_WORK="${RUNNER_TEMP}/public15-work" \
          python - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/public15.log"
          import json
          import os
          from pathlib import Path
          from PIL import Image
          from app.pipeline_entry import run_pipeline
          from engine.regression.rfv3_measurement_runner import load_qualification_cases

          corpus = Path(os.environ["RFV_CORPUS"])
          work = Path(os.environ["RFV_WORK"])
          case = next(c for c in load_qualification_cases(corpus) if c.case_id == "qualification-public-15")
          source = corpus / case.source_path
          print("TASK_C_SOURCE=" + json.dumps({
              "case_id": case.case_id,
              "source_path": case.source_path,
              "source_sha256": case.source_sha256,
          }, sort_keys=True))
          try:
              with Image.open(source) as opened:
                  image = opened.convert("RGBA")
              result = run_pipeline(image, source, "auto", work, refine=True, edge_cleanup=True)
              compact = {
                  key: str(value)
                  for key, value in result.items()
                  if key in {"svg", "svg_path", "status", "mode", "trace_mode"}
              }
              print("TASK_C_PIPELINE_RESULT=" + json.dumps(compact, sort_keys=True))
          except BaseException as exc:
              print("TASK_C_PIPELINE_EXCEPTION=" + json.dumps({
                  "type": type(exc).__name__,
                  "message": str(exc),
              }, sort_keys=True))
          PY
      - name: Extract exact-color Task C ledger
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path(os.environ["RUNNER_TEMP"]) / "public15.log"
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          prefix = "source_alpha_candidate_painter_attempts="
          ledgers = [json.loads(line.split(prefix, 1)[1]) for line in lines if prefix in line]
          if not ledgers:
              raise SystemExit("no painter ledger emitted")

          chosen = None
          for entries in ledgers:
              pd = [e for e in entries if isinstance(e, dict) and str(e.get("encoding_label", "")).startswith("paint-deficit")]
              if pd and any(int(e.get("byte_limit") or -1) == 304990 for e in pd):
                  chosen = entries
                  break
          if chosen is None:
              raise SystemExit("public-15 paint-deficit ledger with byte_limit=304990 not found")

          selected = [e for e in chosen if isinstance(e, dict) and str(e.get("encoding_label", "")).startswith("paint-deficit")]
          for entry in selected:
              print("TASK_C_ATTEMPT=" + json.dumps(entry, sort_keys=True))

          expected_labels = [
              "paint-deficit-q24",
              "paint-deficit-cumulative",
              "paint-deficit-cumulative-q20",
              "paint-deficit-cumulative-q16",
              "paint-deficit-cumulative-q12",
              "paint-deficit-cumulative-q8",
          ]
          legacy = [e for e in selected if e.get("exact_or_quantized") == "paint_deficit"]
          labels = [str(e.get("encoding_label")) for e in legacy]
          if labels != expected_labels:
              raise SystemExit(f"legacy ladder drifted: {labels!r}")
          expected_bytes = [1194110, 870542, 831463, 793597, 755710, 717866]
          actual_bytes = [int(e.get("actual_serialized_bytes")) for e in legacy]
          if actual_bytes != expected_bytes:
              raise SystemExit(f"legacy bytes drifted: {actual_bytes!r}")
          if not all(e.get("status") == "byte_rejected" for e in legacy):
              raise SystemExit("legacy ladder is not byte-only exhausted")
          if not all(int(e.get("paint_deficit_pixel_count")) == 1099083 for e in legacy):
              raise SystemExit("legacy deficit count drifted")

          fallback = [e for e in selected if e.get("exact_or_quantized") == "paint_deficit_support_compact"]
          if len(fallback) != 1:
              raise SystemExit(f"expected one exact support fallback, got {len(fallback)}")
          fb = fallback[0]
          if fb.get("encoding_label") != "paint-deficit-cumulative-q8-base-delta":
              raise SystemExit(f"unexpected fallback label: {fb.get('encoding_label')!r}")
          if int(fb.get("paint_deficit_pixel_count")) != 1099083:
              raise SystemExit("exact support fallback changed deficit coverage")

          summary = {
              "task_head_sha": os.environ["TASK_HEAD_SHA"],
              "unchanged_budget": 304990,
              "legacy_bytes": actual_bytes,
              "fallback": fb,
              "fits_byte_budget": int(fb.get("actual_serialized_bytes") or 10**18) <= 304990,
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "task-c-public15-summary.json"
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("TASK_C_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY
      - name: Upload exact-color public-15 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-c-public15-exact-${{ env.TASK_HEAD_SHA }}
          path: |
            ${{ runner.temp }}/public15.log
            ${{ runner.temp }}/public15-prepare.json
            ${{ runner.temp }}/task-c-public15-summary.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
