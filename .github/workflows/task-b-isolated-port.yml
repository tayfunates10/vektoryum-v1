name: Task B isolated canonical port

on:
  push:
    branches:
      - validation/task-b-port-windows-isolated

permissions:
  contents: write

jobs:
  port-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CANONICAL_BRANCH: codex/task-b-public04-evaluator-aligned-rfv3b
      EXPECTED_CANONICAL_HEAD: 1d45015b2ed21405a7258512c441bed5a0366871
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact canonical head
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git reset --hard HEAD
          git fetch origin "${CANONICAL_BRANCH}"
          git checkout -B task-b-port "origin/${CANONICAL_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_CANONICAL_HEAD}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install production dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Apply exact terminal hook
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/app/alpha_candidate_painter.py")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "        if winner is None and _node_free_polygon_retry_eligible(attempts):",
              "            # Kesin eklemeli son çare: mevcut tüm aday yolları önce aynen",
              "            # tüketilir; bugün winner üreten hiçbir vaka bu fazı görmez.",
              "            winner = _evaluate_node_free_quantized()",
          ])
          new = old + "\n" + "\n".join([
              "        if winner is None:",
              "            from app.alpha_candidate_evaluator_retry import (  # noqa: PLC0415",
              "                evaluate_evaluator_aligned_paint_deficit,",
              "            )",
              "",
              "            winner = evaluate_evaluator_aligned_paint_deficit(",
              "                attempts=attempts,",
              "                original_root=original_root,",
              "                canvas=canvas,",
              "                source_rgba_full=source_rgba_full,",
              "                parent_sha256=parent_sha256,",
              "                mode=mode,",
              "                parent_counts=parent_counts,",
              "                limits=limits,",
              "                target=target,",
              "                excluded_from_parent=excluded_from_parent,",
              "                parent_journal_path=parent_journal_path,",
              "                journal_source_rgb=journal_source_rgb,",
              "                journal_image_class=journal_image_class,",
              "                write_tree_to_temp=_write_tree_to_temp,",
              "                assess_candidate=_assess_painter_candidate,",
              "                run_geometry_journal=_run_painter_geometry_journal,",
              "            )",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"terminal anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old_grid = "\n".join([
              '            "painter_grid_width": int(grid_width),',
              '            "painter_grid_height": int(grid_height),',
          ])
          new_grid = "\n".join([
              '            "painter_grid_width": int(',
              '                w_geometry.get("evaluator_aligned_grid_width", grid_width)',
              '            ),',
              '            "painter_grid_height": int(',
              '                w_geometry.get("evaluator_aligned_grid_height", grid_height)',
              '            ),',
          ])
          if text.count(old_grid) != 1:
              raise SystemExit(f"grid anchor count={text.count(old_grid)}")
          path.write_bytes(text.replace(old_grid, new_grid, 1).encode("utf-8"))
          PY

      - name: Compile and run frozen painter contracts
        run: |
          python -m py_compile engine/app/alpha_candidate_painter.py engine/app/alpha_candidate_evaluator_retry.py engine/test_alpha_painter_evaluator_aligned_retry.py
          python -m unittest \
            engine.test_alpha_painter_evaluator_aligned_retry \
            engine.test_alpha_painter_ledger \
            engine.test_alpha_painter_stroke_continuation \
            engine.test_alpha_painter_cumulative_levels \
            engine.test_alpha_painter_polygon_quantized_retry -v

      - name: Publish verified hook to canonical branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-b-canonical-port.yml
          git rm .github/workflows/task-b-canonical-port-macos.yml
          git rm .github/workflows/task-b-canonical-port-windows.yml
          git add engine/app/alpha_candidate_painter.py
          git diff --cached --check
          git commit -m "fix(alpha): add evaluator-aligned terminal painter retry"
          git push origin HEAD:"${CANONICAL_BRANCH}"
