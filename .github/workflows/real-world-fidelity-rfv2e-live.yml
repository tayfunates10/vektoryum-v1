name: Real-world fidelity RFV-2E live acquisition evidence

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: rfv2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rfv2e-live-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Compile RFV-2E files
        run: |
          python -m py_compile \
            engine/regression/rfv2_public_source_acquire.py \
            engine/regression/rfv2_live_acquire.py \
            engine/regression/rfv2_manifest_assembler.py \
            engine/regression/rfv2_live_bundle.py \
            engine/regression/test_rfv2_live_acquire.py \
            engine/regression/test_rfv2_live_bundle.py

      - name: Validate deterministic fail-closed acquisition and bundle contracts
        run: |
          python -m unittest \
            engine.regression.test_rfv2_live_acquire \
            engine.regression.test_rfv2_live_bundle

      - name: Acquire and qualify all 24 reviewed public sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RFV_ROOT="${RUNNER_TEMP}/rfv2-live"
          rm -rf "${RFV_ROOT}"
          mkdir -p "${RFV_ROOT}/out"

          set +e
          (
            set -euo pipefail
            acquired=0
            for attempt in 1 2 3; do
              rm -rf \
                "${RFV_ROOT}/downloads" \
                "${RFV_ROOT}/storage" \
                "${RFV_ROOT}/records"
              mkdir -p \
                "${RFV_ROOT}/downloads" \
                "${RFV_ROOT}/storage" \
                "${RFV_ROOT}/records"
              if python -m engine.regression.rfv2_live_acquire \
                --all \
                --download-root "${RFV_ROOT}/downloads" \
                --storage-root "${RFV_ROOT}/storage" \
                --records-dir "${RFV_ROOT}/records"; then
                acquired=1
                break
              fi
              echo "RFV-2E acquisition attempt ${attempt} failed; retrying reviewed allowlist"
              sleep "$((attempt * 10))"
            done

            if [ "${acquired}" -eq 1 ]; then
              python -m engine.regression.rfv2_manifest_assembler \
                --records-dir "${RFV_ROOT}/records" \
                --manifest-out "${RFV_ROOT}/out/qualification-manifest.json" \
                --audit-out "${RFV_ROOT}/out/qualification-audit.json" \
                --require-complete

              python -m engine.regression.rfv2_live_bundle \
                --storage-root "${RFV_ROOT}/storage" \
                --download-root "${RFV_ROOT}/downloads" \
                --records-dir "${RFV_ROOT}/records" \
                --manifest "${RFV_ROOT}/out/qualification-manifest.json" \
                --audit "${RFV_ROOT}/out/qualification-audit.json" \
                --bundle-out "${RFV_ROOT}/out/rfv2-public-corpus.tar.gz" \
                --checksums-out "${RFV_ROOT}/out/bundle-checksums.json"
            else
              echo "RFV-2E live provider unavailable; resolving latest verified immutable corpus"
              python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import shutil
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["RUNNER_TEMP"]) / "rfv2-live"
          out = root / "out"
          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          prefix = "rfv2-public-qualification-corpus-"
          required = {
              "rfv2-public-corpus.tar.gz",
              "qualification-manifest.json",
              "qualification-audit.json",
              "bundle-checksums.json",
          }

          def request_json(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          def request_bytes(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  response = opener.open(request, timeout=60)
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get("Location")
                  if not location or not location.startswith("https://"):
                      raise RuntimeError("artifact redirect location rejected") from exc
              else:
                  with response:
                      return response.read()
              # Never forward the repository token to GitHub's temporary object
              # storage host. The signed redirect URL is sufficient by design.
              with urllib.request.urlopen(location, timeout=120) as response:
                  return response.read()

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          committed = json.loads(
              Path("engine/regression/rfv2_qualification_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_cases = {
              case["case_id"]: {
                  key: case[key]
                  for key in (
                      "case_id",
                      "category",
                      "license",
                      "source_sha256",
                      "source_format",
                      "file_bytes",
                      "width",
                      "height",
                      "storage_object_id",
                  )
              }
              for case in committed["cases"]
          }
          if len(expected_cases) != 24:
              raise RuntimeError("committed RFV-2 qualification identity is incomplete")

          listing = request_json(
              f"https://api.github.com/repos/{repository}/actions/artifacts?per_page=100"
          )
          artifacts = sorted(
              (
                  artifact
                  for artifact in listing.get("artifacts", [])
                  if str(artifact.get("name", "")).startswith(prefix)
                  and not artifact.get("expired", True)
              ),
              key=lambda artifact: str(artifact.get("created_at", "")),
              reverse=True,
          )
          failures = []
          selected = None
          for artifact in artifacts:
              try:
                  payload = request_bytes(str(artifact["archive_download_url"]))
                  advertised = str(artifact.get("digest") or "")
                  actual_zip_digest = hashlib.sha256(payload).hexdigest()
                  if advertised:
                      if advertised.removeprefix("sha256:") != actual_zip_digest:
                          raise RuntimeError("artifact archive digest mismatch")

                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      names = set(archive.namelist())
                      safe_names = {
                          name
                          for name in names
                          if not PurePosixPath(name).is_absolute()
                          and ".." not in PurePosixPath(name).parts
                      }
                      if names != safe_names or not required.issubset(names):
                          raise RuntimeError("artifact archive layout rejected")
                      for name in required:
                          target = out / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with archive.open(name) as source, target.open("wb") as sink:
                              shutil.copyfileobj(source, sink)

                  manifest = json.loads(
                      (out / "qualification-manifest.json").read_text(encoding="utf-8")
                  )
                  audit = json.loads(
                      (out / "qualification-audit.json").read_text(encoding="utf-8")
                  )
                  checksums = json.loads(
                      (out / "bundle-checksums.json").read_text(encoding="utf-8")
                  )
                  actual_cases = {
                      case["case_id"]: {
                          key: case[key]
                          for key in (
                              "case_id",
                              "category",
                              "license",
                              "source_sha256",
                              "source_format",
                              "file_bytes",
                              "width",
                              "height",
                              "storage_object_id",
                          )
                      }
                      for case in manifest["cases"]
                  }
                  if actual_cases != expected_cases:
                      raise RuntimeError("cached corpus source identity drift")
                  if manifest.get("status") != "qualified":
                      raise RuntimeError("cached corpus is not qualified")
                  if manifest.get("qualified_case_count") != 24:
                      raise RuntimeError("cached corpus case count drift")
                  if manifest.get("cases_sha256") != checksums.get("cases_sha256"):
                      raise RuntimeError("cached corpus cases digest mismatch")
                  if audit.get("complete") is not True or audit.get("missing_categories") != []:
                      raise RuntimeError("cached corpus audit is incomplete")
                  if digest(out / "rfv2-public-corpus.tar.gz") != checksums.get(
                      "bundle_sha256"
                  ):
                      raise RuntimeError("cached corpus bundle digest mismatch")
                  if digest(out / "qualification-manifest.json") != checksums.get(
                      "qualification_manifest_sha256"
                  ):
                      raise RuntimeError("cached qualification manifest digest mismatch")
                  if digest(out / "qualification-audit.json") != checksums.get(
                      "qualification_audit_sha256"
                  ):
                      raise RuntimeError("cached qualification audit digest mismatch")
                  if checksums.get("storage_mode") != "github_actions_immutable_artifact":
                      raise RuntimeError("cached corpus storage mode rejected")
                  selected = artifact
                  break
              except Exception as exc:
                  failures.append(f"{artifact.get('id')}: {type(exc).__name__}: {exc}")
                  for name in required:
                      (out / name).unlink(missing_ok=True)

          if selected is None:
              raise RuntimeError(
                  "no verified immutable RFV-2 corpus artifact available: "
                  + " | ".join(failures[-5:])
              )

          provenance = {
              "schema": "vektoryum-rfv2-immutable-fallback-v1",
              "reason": "bounded_live_provider_attempts_exhausted",
              "source_artifact_id": int(selected["id"]),
              "source_artifact_name": selected["name"],
              "source_artifact_digest": selected.get("digest"),
              "source_created_at": selected.get("created_at"),
              "cases_sha256": checksums["cases_sha256"],
              "bundle_sha256": checksums["bundle_sha256"],
              "qualified_case_count": 24,
              "verification": "committed_source_identity_and_internal_sha256",
          }
          (out / "fallback-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "RFV-2E immutable fallback accepted: "
              f"artifact={selected['id']} cases_sha256={checksums['cases_sha256']}"
          )
          PY
            fi

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "rfv2-live" / "out"
          manifest = json.loads((root / "qualification-manifest.json").read_text())
          audit = json.loads((root / "qualification-audit.json").read_text())
          checksums = json.loads((root / "bundle-checksums.json").read_text())
          assert manifest["status"] == "qualified"
          assert manifest["qualified_case_count"] == 24
          assert len(manifest["cases"]) == 24
          assert audit["complete"] is True
          assert audit["missing_categories"] == []
          assert checksums["qualified_case_count"] == 24
          assert checksums["storage_mode"] == "github_actions_immutable_artifact"
          assert checksums["retention_days"] == 90
          assert (root / "rfv2-public-corpus.tar.gz").stat().st_size > 0
          PY
          ) 2>&1 | tee "${RFV_ROOT}/out/live-acquisition.log"
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            tail -n 80 "${RFV_ROOT}/out/live-acquisition.log" > "${RFV_ROOT}/out/failure-tail.log"
            exit "${status}"
          fi

      - name: Upload RFV-2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rfv2e-failure-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rfv2-live/out/live-acquisition.log
            ${{ runner.temp }}/rfv2-live/out/failure-tail.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload immutable RFV-2 corpus artifact
        id: upload-corpus
        uses: actions/upload-artifact@v4
        with:
          name: rfv2-public-qualification-corpus-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rfv2-live/out/rfv2-public-corpus.tar.gz
            ${{ runner.temp }}/rfv2-live/out/qualification-manifest.json
            ${{ runner.temp }}/rfv2-live/out/qualification-audit.json
            ${{ runner.temp }}/rfv2-live/out/bundle-checksums.json
            ${{ runner.temp }}/rfv2-live/out/fallback-provenance.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Bind artifact identity to acquisition evidence
        env:
          ARTIFACT_ID: ${{ steps.upload-corpus.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-corpus.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-corpus.outputs.artifact-digest }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_url = os.environ["ARTIFACT_URL"]
          artifact_digest = os.environ["ARTIFACT_DIGEST"]
          head_sha = os.environ["HEAD_SHA"]
          assert artifact_id.isdigit()
          assert artifact_url.startswith("https://github.com/")
          assert re.fullmatch(r"(?:sha256:)?[0-9a-f]{64}", artifact_digest)
          assert re.fullmatch(r"[0-9a-f]{40}", head_sha)

          root = Path(os.environ["RUNNER_TEMP"]) / "rfv2-live" / "out"
          checksums = json.loads((root / "bundle-checksums.json").read_text())
          fallback = root / "fallback-provenance.json"
          envelope = {
              "schema": "vektoryum-rfv2-actions-publication-envelope-v1",
              "head_sha": head_sha,
              "artifact_id": int(artifact_id),
              "artifact_url": artifact_url,
              "artifact_digest": artifact_digest,
              "retention_days": 90,
              "qualified_case_count": 24,
              "cases_sha256": checksums["cases_sha256"],
              "bundle_sha256": checksums["bundle_sha256"],
              "raw_assets_in_repository": False,
              "acquisition_mode": (
                  "verified_immutable_fallback" if fallback.is_file() else "live"
              ),
          }
          (root / "publication-envelope.json").write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload publication envelope
        uses: actions/upload-artifact@v4
        with:
          name: rfv2-publication-envelope-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rfv2-live/out/publication-envelope.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
