name: Real-world fidelity RFV-2E live acquisition evidence

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: rfv2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rfv2e-live-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Compile RFV-2E files
        run: |
          python -m py_compile \
            engine/regression/rfv2_public_source_acquire.py \
            engine/regression/rfv2_live_acquire.py \
            engine/regression/rfv2_manifest_assembler.py \
            engine/regression/rfv2_live_bundle.py \
            engine/regression/test_rfv2_live_acquire.py \
            engine/regression/test_rfv2_live_bundle.py

      - name: Validate deterministic fail-closed acquisition and bundle contracts
        run: |
          python -m unittest \
            engine.regression.test_rfv2_live_acquire \
            engine.regression.test_rfv2_live_bundle

      - name: Acquire or restore the exact 24 reviewed public sources
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINNED_ARTIFACT_ID: "8354853386"
          PINNED_ARTIFACT_SHA256: "a8be8c0782a8aeb037a2736de8adbd357c5074ad0da6355562e2543092d6af76"
        run: |
          set -uo pipefail
          RFV_ROOT="${RUNNER_TEMP}/rfv2-live"
          rm -rf "${RFV_ROOT}"
          mkdir -p "${RFV_ROOT}/out"

          set +e
          (
            set -euo pipefail
            acquired=0
            for attempt in 1 2 3; do
              rm -rf \
                "${RFV_ROOT}/downloads" \
                "${RFV_ROOT}/storage" \
                "${RFV_ROOT}/records"
              mkdir -p \
                "${RFV_ROOT}/downloads" \
                "${RFV_ROOT}/storage" \
                "${RFV_ROOT}/records"
              if python -m engine.regression.rfv2_live_acquire \
                --all \
                --download-root "${RFV_ROOT}/downloads" \
                --storage-root "${RFV_ROOT}/storage" \
                --records-dir "${RFV_ROOT}/records"; then
                acquired=1
                break
              fi
              echo "RFV-2E acquisition attempt ${attempt} failed; retrying reviewed allowlist"
              sleep "$((attempt * 10))"
            done

            if [ "${acquired}" -eq 1 ]; then
              python -m engine.regression.rfv2_manifest_assembler \
                --records-dir "${RFV_ROOT}/records" \
                --manifest-out "${RFV_ROOT}/out/qualification-manifest.json" \
                --audit-out "${RFV_ROOT}/out/qualification-audit.json" \
                --require-complete

              python -m engine.regression.rfv2_live_bundle \
                --storage-root "${RFV_ROOT}/storage" \
                --download-root "${RFV_ROOT}/downloads" \
                --records-dir "${RFV_ROOT}/records" \
                --manifest "${RFV_ROOT}/out/qualification-manifest.json" \
                --audit "${RFV_ROOT}/out/qualification-audit.json" \
                --bundle-out "${RFV_ROOT}/out/rfv2-public-corpus.tar.gz" \
                --checksums-out "${RFV_ROOT}/out/bundle-checksums.json"
              echo "RFV-2E source mode: live acquisition"
            else
              echo "RFV-2E live acquisition unavailable; restoring SHA-pinned immutable corpus"
              cache_zip="${RFV_ROOT}/pinned-rfv2-corpus.zip"
              curl \
                --fail-with-body \
                --location \
                --silent \
                --show-error \
                --retry 3 \
                --retry-all-errors \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
                --output "${cache_zip}"

              CACHE_ZIP="${cache_zip}" RFV_OUT="${RFV_ROOT}/out" \
              PINNED_ARTIFACT_SHA256="${PINNED_ARTIFACT_SHA256}" python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["CACHE_ZIP"])
          output = Path(os.environ["RFV_OUT"])
          expected_archive = os.environ["PINNED_ARTIFACT_SHA256"]
          expected_files = {
              "rfv2-public-corpus.tar.gz": "1da641ad27b58985e4e1cf8d9972af5a15f5105e85e2c319151a5e373b6afc46",
              "qualification-manifest.json": "c2b1f4381d4ac9cd96e1ce8ba27589103a3ee696838dbf3dc487db96e51130aa",
              "qualification-audit.json": "cf42d7d4fb820c915a2023b242c10a54e21ca87c721f9b699d55d6a49bb0c0f0",
              "bundle-checksums.json": "ff39ab6e320dbede7241ceefa9eea87d31c3b4e52bb31366aa49278067826655",
          }
          archive_bytes = archive.read_bytes()
          assert len(archive_bytes) == 10910811
          assert hashlib.sha256(archive_bytes).hexdigest() == expected_archive

          with zipfile.ZipFile(archive) as package:
              infos = package.infolist()
              names = [info.filename for info in infos]
              assert len(names) == len(set(names))
              assert set(names) == set(expected_files)
              payloads = {}
              for info in infos:
                  name = info.filename
                  assert PurePosixPath(name).name == name
                  assert not info.is_dir()
                  assert not (info.flag_bits & 0x1)
                  mode = (info.external_attr >> 16) & 0o170000
                  assert mode in (0, stat.S_IFREG)
                  assert info.file_size <= 12_000_000
                  data = package.read(info)
                  assert len(data) == info.file_size
                  assert hashlib.sha256(data).hexdigest() == expected_files[name]
                  payloads[name] = data

          manifest = json.loads(payloads["qualification-manifest.json"])
          audit = json.loads(payloads["qualification-audit.json"])
          checksums = json.loads(payloads["bundle-checksums.json"])
          assert manifest["status"] == "qualified"
          assert manifest["qualified_case_count"] == 24
          assert len(manifest["cases"]) == 24
          assert audit["complete"] is True
          assert audit["qualified_case_count"] == 24
          assert audit["missing_categories"] == []
          assert checksums["schema"] == "vektoryum-rfv2-live-bundle-checksums-v1"
          assert checksums["qualified_case_count"] == 24
          assert checksums["cases_sha256"] == "5f151a6cb1a433b0cb0989a67bd7cc7940162f4b36d67903d6ccdd173f9e7d89"
          assert checksums["bundle_sha256"] == expected_files["rfv2-public-corpus.tar.gz"]
          assert checksums["storage_mode"] == "github_actions_immutable_artifact"
          assert checksums["retention_days"] == 90
          assert manifest["cases_sha256"] == checksums["cases_sha256"]
          assert audit["cases_sha256"] == checksums["cases_sha256"]

          output.mkdir(parents=True, exist_ok=True)
          for name, data in payloads.items():
              temporary = output / f".{name}.pinned.tmp"
              temporary.write_bytes(data)
              temporary.replace(output / name)
          PY
              echo "RFV-2E source mode: pinned immutable artifact ${PINNED_ARTIFACT_ID}"
            fi

            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "rfv2-live" / "out"
          manifest = json.loads((root / "qualification-manifest.json").read_text())
          audit = json.loads((root / "qualification-audit.json").read_text())
          checksums = json.loads((root / "bundle-checksums.json").read_text())
          bundle = root / "rfv2-public-corpus.tar.gz"
          assert manifest["status"] == "qualified"
          assert manifest["qualified_case_count"] == 24
          assert len(manifest["cases"]) == 24
          assert audit["complete"] is True
          assert audit["missing_categories"] == []
          assert checksums["qualified_case_count"] == 24
          assert checksums["storage_mode"] == "github_actions_immutable_artifact"
          assert checksums["retention_days"] == 90
          assert checksums["cases_sha256"] == manifest["cases_sha256"] == audit["cases_sha256"]
          assert bundle.stat().st_size > 0
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == checksums["bundle_sha256"]
          PY
          ) 2>&1 | tee "${RFV_ROOT}/out/live-acquisition.log"
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            tail -n 80 "${RFV_ROOT}/out/live-acquisition.log" > "${RFV_ROOT}/out/failure-tail.log"
            exit "${status}"
          fi

      - name: Upload RFV-2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rfv2e-failure-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rfv2-live/out/live-acquisition.log
            ${{ runner.temp }}/rfv2-live/out/failure-tail.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload immutable RFV-2 corpus artifact
        id: upload-corpus
        uses: actions/upload-artifact@v4
        with:
          name: rfv2-public-qualification-corpus-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rfv2-live/out/rfv2-public-corpus.tar.gz
            ${{ runner.temp }}/rfv2-live/out/qualification-manifest.json
            ${{ runner.temp }}/rfv2-live/out/qualification-audit.json
            ${{ runner.temp }}/rfv2-live/out/bundle-checksums.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Bind artifact identity to acquisition evidence
        env:
          ARTIFACT_ID: ${{ steps.upload-corpus.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-corpus.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-corpus.outputs.artifact-digest }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_url = os.environ["ARTIFACT_URL"]
          artifact_digest = os.environ["ARTIFACT_DIGEST"]
          head_sha = os.environ["HEAD_SHA"]
          assert artifact_id.isdigit()
          assert artifact_url.startswith("https://github.com/")
          assert re.fullmatch(r"(?:sha256:)?[0-9a-f]{64}", artifact_digest)
          assert re.fullmatch(r"[0-9a-f]{40}", head_sha)

          root = Path(os.environ["RUNNER_TEMP"]) / "rfv2-live" / "out"
          checksums = json.loads((root / "bundle-checksums.json").read_text())
          envelope = {
              "schema": "vektoryum-rfv2-actions-publication-envelope-v1",
              "head_sha": head_sha,
              "artifact_id": int(artifact_id),
              "artifact_url": artifact_url,
              "artifact_digest": artifact_digest,
              "retention_days": 90,
              "qualified_case_count": 24,
              "cases_sha256": checksums["cases_sha256"],
              "bundle_sha256": checksums["bundle_sha256"],
              "raw_assets_in_repository": False,
          }
          (root / "publication-envelope.json").write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload publication envelope
        uses: actions/upload-artifact@v4
        with:
          name: rfv2-publication-envelope-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rfv2-live/out/publication-envelope.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
