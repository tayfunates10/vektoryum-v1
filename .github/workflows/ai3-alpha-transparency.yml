name: AI-3 alpha transparency contract

on:
  push:
    branches:
      - codex/ai3-alpha-transparency
    paths:
      - "engine/app/alpha_candidate_support.py"
      - "engine/app/alpha_candidate_validation.py"
      - "engine/test_alpha_candidate_validation.py"
      - "engine/test_issue138_alpha_transparency.py"
      - ".github/workflows/ai3-alpha-transparency.yml"
  pull_request:
    paths:
      - "engine/app/alpha_candidate_support.py"
      - "engine/app/alpha_candidate_validation.py"
      - "engine/test_alpha_candidate_validation.py"
      - "engine/test_issue138_alpha_transparency.py"
      - ".github/workflows/ai3-alpha-transparency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai3-alpha-transparency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine
    env:
      PYTHONHASHSEED: "0"
      VEKTORYUM_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install system validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript libcairo2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Issue 138 historical-equivalent and composite-aware alpha gates
        run: >-
          python -m pytest -q -s
          test_issue138_alpha_transparency.py
          test_alpha_candidate_validation.py
          test_alpha_candidate_knockout.py
          test_alpha_candidate_support.py
          test_alpha_multibackground_fidelity.py
          test_source_truth.py
