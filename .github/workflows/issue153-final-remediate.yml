name: Issue153 final remediation

on:
  push:
    branches:
      - codex/ai4-round3-gradient-topology
    paths:
      - .github/workflows/issue153-final-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply source patch
        run: python .github/issue153_final_remediate.py
      - name: Compile changed modules
        run: python -m py_compile engine/app/analyzer.py engine/app/transform_journal.py engine/app/alpha_parent_selection.py engine/test_analyzer_contracts.py engine/test_transform_journal.py
      - name: Run focused remediation contracts
        run: python -m pytest -q engine/test_analyzer_contracts.py engine/test_transform_journal.py engine/test_ai2_component_quality.py engine/test_issue153_post_refit_contract.py
      - name: Commit source patch and remove temporary files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/issue153_final_remediate.py
          git rm .github/workflows/issue153-final-remediate.yml
          git add engine/app/analyzer.py engine/app/transform_journal.py engine/test_analyzer_contracts.py engine/test_transform_journal.py
          git diff --cached --check
          git commit -m 'fix(issue153): satisfy manager benchmark and exact-final remediation'
          git push origin HEAD:codex/ai4-round3-gradient-topology
