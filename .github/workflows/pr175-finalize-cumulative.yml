name: PR175 finalize cumulative quantization

on:
  pull_request:
    branches:
      - claude/yoneticilik-sorunlari-gorevler-b1pfya

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/p0-public15-cumulative-mask-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-public15-cumulative-mask-fix
          fetch-depth: 0
      - name: Pin cumulative ladder to full requantization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('engine/app/alpha_candidate_painter.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    cumulative_quantized_specs:')
          end = text.index('    attempts: list[dict[str, Any]] = []', start)
          block = text[start:end]
          old = '        requant, requant_opacity = _requantize_alpha(grid_alpha, target_levels)\n'
          new = '        requant, requant_opacity = _requantize_alpha(\n            grid_alpha, target_levels, allow_silhouette_shortcut=False\n        )\n'
          if new not in block:
              if old not in block:
                  raise SystemExit('cumulative requantization anchor not found')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')

          test = Path('engine/regression/test_public15_cumulative_mask_encoding.py')
          t = test.read_text(encoding='utf-8')
          if 'test_cumulative_requantization_keeps_multiple_alpha_levels' not in t:
              t = t.replace(
                  'from app.alpha_candidate_painter import build_painter_reconstruction_tree\n',
                  'from app.alpha_candidate_painter import (\n    _requantize_alpha,\n    build_painter_reconstruction_tree,\n)\n',
              )
              t += '''\n\ndef test_cumulative_requantization_keeps_multiple_alpha_levels() -> None:\n    alpha = np.arange(256, dtype=np.uint8).reshape(16, 16)\n    for levels in (32, 16, 8):\n        quantized, opacity = _requantize_alpha(\n            alpha, levels, allow_silhouette_shortcut=False\n        )\n        positive_levels = [level for level in opacity if int(level) > 0]\n        assert len(positive_levels) > 1\n        assert len(np.unique(quantized[alpha > 0])) > 1\n'''
              test.write_text(t, encoding='utf-8')
          PY

          python -m py_compile engine/app/alpha_candidate_painter.py engine/regression/test_public15_cumulative_mask_encoding.py
          rm -f .github/workflows/pr175-finalize-cumulative.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): keep cumulative fallback multi-level"
          git push origin HEAD:codex/p0-public15-cumulative-mask-fix
