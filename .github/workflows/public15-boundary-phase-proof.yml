name: Public-15 boundary phase proof

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/public15-boundary-phase-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: engine
      VEKTORYUM_WORKERS: '1'
      CORPUS_RUN_ID: '31875365505'
      CORPUS_ARTIFACT: rfv3b-corpus-7dfab896dfaab72eb79242e4511ee64860151f9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libcairo2
          python -m pip install -r engine/requirements.txt pytest httpx
      - name: Download immutable qualified corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CORPUS_ARTIFACT }}
          path: ${{ runner.temp }}/rfv3b-input
          github-token: ${{ github.token }}
          repository: tayfunates10/vektoryum-v1
          run-id: ${{ env.CORPUS_RUN_ID }}
      - name: Verify and prepare immutable corpus
        run: |
          python -m engine.regression.rfv3_live_prepare \
            --bundle "${RUNNER_TEMP}/rfv3b-input/rfv2-public-corpus.tar.gz" \
            --checksums "${RUNNER_TEMP}/rfv3b-input/bundle-checksums.json" \
            --destination "${RUNNER_TEMP}/rfv3b-corpus" \
            --evidence-out "${RUNNER_TEMP}/public15-prepare.json"
      - name: Run public-15 boundary phase proof
        env:
          RFV_CORPUS: ${{ runner.temp }}/rfv3b-corpus
          PROOF_OUT: ${{ runner.temp }}/public15-boundary-phase
          ENGINE_VERSION: ${{ github.sha }}
        run: |
          python -m engine.regression.public15_boundary_phase_probe | tee "${RUNNER_TEMP}/public15-boundary-phase.log"
      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public15-boundary-phase-${{ github.sha }}
          path: |
            ${{ runner.temp }}/public15-prepare.json
            ${{ runner.temp }}/public15-boundary-phase.log
            ${{ runner.temp }}/public15-boundary-phase/public15-boundary-phase-proof.json
            ${{ runner.temp }}/public15-boundary-phase/*.svg
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
