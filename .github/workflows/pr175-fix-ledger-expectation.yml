name: PR175 fix ledger expectation

on:
  pull_request:
    branches:
      - claude/yoneticilik-sorunlari-gorevler-b1pfya

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/p0-public15-cumulative-mask-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-public15-cumulative-mask-fix
          fetch-depth: 0
      - name: Update ledger expectation and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/test_alpha_painter_ledger.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    "cumulative-q32",\n                    "cumulative-q16",\n                    "cumulative-q8",\n'''
          new = '''                    "cumulative-q32",\n                    "cumulative-q16",\n                    "cumulative-q8",\n                    "cumulative-q4",\n                    "cumulative-q3",\n'''
          if old not in text:
              raise SystemExit('ledger expectation anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/pr175-fix-ledger-expectation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(alpha): include coarse cumulative fallbacks in ledger contract"
          git push origin HEAD:codex/p0-public15-cumulative-mask-fix
