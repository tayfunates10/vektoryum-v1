name: Issue 153 required F99 contracts
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  f99-required:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32d69e6cf3698f6d0e3bca25064a1a33ecee5647
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validators and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libcairo2
          python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: F99-2 edge curve quality
        run: |
          python -m py_compile engine/tests/test_f99_2_edge_curve_quality.py
          python engine/tests/test_f99_2_edge_curve_quality.py
      - name: F99-3 color fidelity
        run: |
          python -m py_compile engine/tests/test_f99_3_color_fidelity.py
          python engine/tests/test_f99_3_color_fidelity.py
      - name: F99-5 multi-scale fidelity
        run: |
          python -m py_compile engine/tests/test_f99_5_multi_scale_fidelity.py
          python -m unittest -v engine.tests.test_f99_5_multi_scale_fidelity
      - name: F99-6 AI refiner
        run: |
          python -m py_compile engine/tests/test_f99_6_ai_refiner.py
          python -m unittest -v engine.tests.test_f99_6_ai_refiner
      - name: F99-7 print-ready validator
        run: |
          python -m py_compile engine/tests/test_f99_7_print_ready_validator.py
          python -m unittest -v engine.tests.test_f99_7_print_ready_validator
      - name: F99-8 final fidelity gate
        run: |
          python -m py_compile engine/tests/test_f99_8_final_fidelity_gate.py
          python -m unittest -v engine.tests.test_f99_8_final_fidelity_gate
      - name: Remove temporary workflow without changing source tree
        if: success()
        shell: bash
        run: |
          git fetch origin codex/ai4-round3-gradient-topology
          git checkout -B codex/ai4-round3-gradient-topology origin/codex/ai4-round3-gradient-topology
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-f99-required.yml
          git commit -m "Remove temporary Issue #153 F99 runner"
          git push origin HEAD:codex/ai4-round3-gradient-topology
