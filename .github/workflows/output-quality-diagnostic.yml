name: Output quality diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/output-quality-diagnostic.yml"
      - "engine/app/**"
      - "engine/benchmark/**"
      - "engine/regression/output_quality_suite.py"
      - "engine/regression/output_quality_root_cause.py"
      - "engine/regression/test_output_quality_suite.py"
      - "engine/regression/test_output_quality_root_cause.py"
      - "engine/regression/test_neutral_multitone_routing.py"
      - "engine/regression/test_alpha_parent_trial_diagnostics.py"
      - "engine/regression/test_gradient_chromatic_boundary.py"
      - "engine/regression/test_evaluator_ssim_corroboration.py"
      - "engine/requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read
  actions: read

concurrency:
  group: output-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install production and test dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest

      - name: Compile diagnostic files
        run: >-
          python -m py_compile
          engine/regression/output_quality_suite.py
          engine/regression/output_quality_root_cause.py
          engine/regression/test_output_quality_suite.py
          engine/regression/test_output_quality_root_cause.py
          engine/regression/test_neutral_multitone_routing.py
          engine/regression/test_alpha_parent_trial_diagnostics.py
          engine/regression/test_gradient_chromatic_boundary.py
          engine/regression/test_evaluator_ssim_corroboration.py

      - name: Run base output diagnostic contracts
        run: >-
          python -m unittest -v
          engine.regression.test_output_quality_suite
          engine.regression.test_output_quality_root_cause

      - name: Run neutral multi-tone routing contracts
        run: python -m unittest -v engine.regression.test_neutral_multitone_routing

      - name: Run alpha parent selection contracts
        run: >-
          python -m unittest -v
          engine.regression.test_alpha_parent_trial_diagnostics.AlphaParentTrialDiagnosticTests

      - name: Run compact knockout encoder contract
        run: >-
          python -m unittest -v
          engine.regression.test_alpha_parent_trial_diagnostics.CompactCandidateKnockoutTests

      - name: Run chromatic gradient boundary contracts
        run: python -m unittest -v engine.regression.test_gradient_chromatic_boundary

      - name: Run geometry-corroborated SSIM contracts
        run: python -m unittest -v engine.regression.test_evaluator_ssim_corroboration

      - name: Verify diagnostic CLI entrypoint
        run: python -m engine.regression.output_quality_root_cause --help >/dev/null

  production-output:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: .:engine
      VEKTORYUM_WORKERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install system render validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript libcairo2

      - name: Install production pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest

      - name: Run repeat-aware production output diagnostic
        shell: bash
        run: |
          set -o pipefail
          OUTPUT="${RUNNER_TEMP}/output-quality"
          FAIL_ON=structural
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            FAIL_ON=hard
          fi
          python -m engine.regression.output_quality_root_cause \
            --output "${OUTPUT}" \
            --engine-version "${GITHUB_SHA}" \
            --repeat-count 2 \
            --fail-on "${FAIL_ON}" \
            2>&1 | tee "${RUNNER_TEMP}/output-quality.log"

      - name: Validate output-quality evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/output-quality"
          test -s "${ROOT}/output-quality-report.json"
          test -s "${ROOT}/output-quality-root-cause.json"
          test -s "${ROOT}/output-quality-summary.md"
          test -s "${ROOT}/output-quality-root-cause.md"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "output-quality"
          report = json.loads((root / "output-quality-root-cause.json").read_text(encoding="utf-8"))
          assert report["case_count"] == 7
          assert report["repeat_count"] == 2
          assert len(report["cases"]) == 7
          assert all(case["repeat_count_completed"] == 2 for case in report["cases"])
          PY

      - name: Publish Markdown summaries
        if: always()
        shell: bash
        run: |
          found=0
          for SUMMARY in \
            "${RUNNER_TEMP}/output-quality/output-quality-summary.md" \
            "${RUNNER_TEMP}/output-quality/output-quality-root-cause.md"; do
            if [ -f "${SUMMARY}" ]; then
              cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"
              printf '\n' >> "${GITHUB_STEP_SUMMARY}"
              found=1
            fi
          done
          if [ "${found}" -eq 0 ]; then
            echo "Output-quality summaries were not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload output-quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/output-quality
            ${{ runner.temp }}/output-quality.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
