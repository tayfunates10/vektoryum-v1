name: Issue153 winner remediation

on:
  push:
    branches:
      - codex/ai4-round3-gradient-topology
    paths:
      - .github/workflows/issue153-winner-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Restore safe Pareto editability pool
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engine/app/pipeline.py')
          s = p.read_text()
          old = '''def _apply_editability_preference(
              scored: list[dict[str, Any]], current_best: dict[str, Any]
          ) -> tuple[dict[str, Any], str]:
              legacy_best, legacy_reason = _base_apply_editability_preference(scored, current_best)
              if _is_selection_safe(legacy_best):
                  return legacy_best, legacy_reason
              safe = [candidate for candidate in scored if _is_selection_safe(candidate)]
              if not safe:
                  return legacy_best, legacy_reason
              pool = _pareto_front(safe)
              safe_seed = current_best if current_best in pool else max(pool, key=_core._fidelity_rank_key)
              guarded_best, guarded_reason = _base_apply_editability_preference(pool, safe_seed)
              return guarded_best, f"component_integrity_pareto_guard+{guarded_reason}"
          '''
          new = '''def _apply_editability_preference(
              scored: list[dict[str, Any]], current_best: dict[str, Any]
          ) -> tuple[dict[str, Any], str]:
              pool = _selection_pool(scored)
              if current_best not in pool:
                  current_best = max(pool, key=_core._fidelity_rank_key)
              guarded_best, guarded_reason = _base_apply_editability_preference(pool, current_best)
              if pool is scored:
                  return guarded_best, guarded_reason
              return guarded_best, f"component_integrity_pareto_guard+{guarded_reason}"
          '''
          if old not in s:
              raise SystemExit('winner editability anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify focused winner contracts
        run: |
          python -m py_compile engine/app/pipeline.py
          python -m pytest -q engine/test_ai2_component_quality.py engine/test_issue153_post_refit_contract.py engine/test_analyzer_contracts.py engine/test_transform_journal.py
      - name: Commit source and self-delete runner
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue153-winner-remediate.yml
          git add engine/app/pipeline.py
          git diff --cached --check
          git commit -m 'fix(issue153): keep editability selection inside safe Pareto pool'
          git push origin HEAD:codex/ai4-round3-gradient-topology
