name: Public-05 rebased support verification

on:
  push:
    branches: [codex/public05-alpha-support-fallback]
    paths: [.github/workflows/public05-alpha-support-rebase-verify.yml]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public05-alpha-support-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript libcairo2
      - run: python -m pip install -r engine/requirements.txt
      - name: Apply patch to latest PR158 head
        run: python .github/scripts/apply_public05_alpha_support_fix.py
      - name: Compile
        run: python -m py_compile engine/app/alpha_candidate_paint_deficit.py engine/app/alpha_candidate_painter.py engine/test_alpha_painter_public05_support_fallback.py
      - name: Run frozen and new regressions
        run: |
          python -m unittest \
            engine.test_alpha_artwork_identity \
            engine.test_alpha_painter_paint_deficit \
            engine.test_alpha_painter_cumulative_levels \
            engine.test_alpha_painter_ledger \
            engine.test_alpha_painter_stroke_continuation \
            engine.test_alpha_painter_polygon_quantized_retry \
            engine.test_alpha_painter_public05_support_fallback \
            -v
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/app/alpha_candidate_paint_deficit.py engine/app/alpha_candidate_painter.py engine/test_alpha_painter_public05_support_fallback.py
          git diff --cached --check
          git commit -m "Fix public-05 alpha support loss in paint-deficit fallback"
          git push origin HEAD:codex/public05-alpha-support-fallback
