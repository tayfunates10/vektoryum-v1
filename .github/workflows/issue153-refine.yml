name: Issue 153 refine patch
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine continuous-paint observability and regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'missing anchor {path}')
              p.write_text(text.replace(old,new,1))

          replace('engine/app/analyzer.py', '''    pair_count = 0\n    continuous_count = 0\n    for first, second, mask in (\n        (arr[:, :-1], arr[:, 1:], foreground[:, :-1] & foreground[:, 1:]),\n        (arr[:-1, :], arr[1:, :], foreground[:-1, :] & foreground[1:, :]),\n    ):\n        distances = np.linalg.norm(first - second, axis=2)\n        pair_count += int(np.count_nonzero(mask))\n        continuous_count += int(np.count_nonzero(mask & (distances >= 1.0) & (distances <= 32.0)))\n    transition_ratio = float(continuous_count) / float(max(1, pair_count))\n    foreground_bins = np.unique((arr[foreground].astype(np.uint8) // 8), axis=0).shape[0]\n    return bool(\n        foreground_bins >= 12\n        and transition_ratio >= 0.08\n        and smooth_area_ratio >= 0.90\n    )\n''', '''    # Anti-aliased thin strokes also contain small neighbour colour deltas, but\n    # only near their contour. A real filled gradient keeps those transitions in\n    # a substantial interior. Use distance-to-background observability so lineart\n    # edges cannot masquerade as continuous paint.\n    foreground_distance = cv2.distanceTransform(foreground.astype(np.uint8), cv2.DIST_L2, 5)\n    interior = foreground & (foreground_distance >= 3.5)\n    foreground_count = int(np.count_nonzero(foreground))\n    interior_count = int(np.count_nonzero(interior))\n    if interior_count < 20 or interior_count < 0.10 * foreground_count:\n        return False\n\n    pair_count = 0\n    continuous_count = 0\n    for first, second, mask in (\n        (arr[:, :-1], arr[:, 1:], interior[:, :-1] & interior[:, 1:]),\n        (arr[:-1, :], arr[1:, :], interior[:-1, :] & interior[1:, :]),\n    ):\n        distances = np.linalg.norm(first - second, axis=2)\n        pair_count += int(np.count_nonzero(mask))\n        continuous_count += int(np.count_nonzero(mask & (distances >= 1.0) & (distances <= 32.0)))\n    transition_ratio = float(continuous_count) / float(max(1, pair_count))\n    foreground_bins = np.unique((arr[interior].astype(np.uint8) // 8), axis=0).shape[0]\n    return bool(\n        foreground_bins >= 12\n        and transition_ratio >= 0.08\n        and smooth_area_ratio >= 0.90\n    )\n''')

          replace('engine/test_ai2_component_quality.py', '''def test_all_failed_candidates_keep_legacy_score_ordering() -> None:\n''', '''def test_all_failed_candidates_fail_closed_in_winner_selection() -> None:\n''')
          replace('engine/test_ai2_component_quality.py', '''    chosen, _raw, _reason = select_best([lo, hi], "single_color")\n    assert chosen["name"] == "legacy_hi"\n    assert round(hi["total_score"] - lo["total_score"], 2) == 8.89\n''', '''    # Issue #153 closes the legacy escape hatch: preserving score values does\n    # not make a component-unsafe candidate selectable. The gate still leaves\n    # scores uncorrupted for diagnostics, while winner selection fails closed.\n    assert round(hi["total_score"] - lo["total_score"], 2) == 8.89\n    with pytest.raises(RuntimeError, match="no_selection_safe_candidate"):\n        select_best([lo, hi], "single_color")\n''')

          p=Path('engine/test_analyzer_contracts.py')
          text=p.read_text()
          anchor='''    assert analyzer.detect_gradient_like_surface(Image.fromarray(ramp, "RGBA")) is True\n    assert analyzer.detect_gradient_like_surface(Image.fromarray(stepped, "RGBA")) is False\n'''
          addition='''    assert analyzer.detect_gradient_like_surface(Image.fromarray(ramp, "RGBA")) is True\n    assert analyzer.detect_gradient_like_surface(Image.fromarray(stepped, "RGBA")) is False\n\n    # A narrow anti-aliased stroke may have many local shades, but no substantial\n    # continuous-paint interior. It must stay line-like rather than gradient-like.\n    thin = np.full((256, 256, 4), 255, dtype=np.uint8)\n    for x in range(32, 224):\n        value = 40 + (x - 32) % 80\n        thin[126:130, x, :3] = (value, value, value)\n    assert analyzer.detect_gradient_like_surface(Image.fromarray(thin, "RGBA")) is False\n'''
          if anchor not in text: raise SystemExit('missing analyzer test anchor')
          p.write_text(text.replace(anchor,addition,1))
          PY
          python -m py_compile engine/app/analyzer.py engine/test_analyzer_contracts.py engine/test_ai2_component_quality.py
      - name: Run focused guards
        working-directory: engine
        run: |
          python -m pytest -q test_analyzer_contracts.py test_ai2_component_quality.py
      - name: Commit refinement and remove runner
        shell: bash
        run: |
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-refine.yml
          git add engine/app/analyzer.py engine/test_analyzer_contracts.py engine/test_ai2_component_quality.py
          git commit -m "Refine gradient observability and unsafe-winner guard"
          git push origin HEAD:codex/ai4-round3-gradient-topology
