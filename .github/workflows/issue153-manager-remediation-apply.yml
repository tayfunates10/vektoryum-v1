name: Issue 153 manager remediation apply

on:
  push:
    branches:
      - codex/ai4-round3-gradient-topology
    paths:
      - .github/workflows/issue153-manager-remediation-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply bounded remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Analyzer: the Round-3 local continuous-paint fallback is only for
          # a continuous field that meets a real hard semantic discontinuity.
          # A fully smooth benchmark gradient must remain on the established path.
          p = Path('engine/app/analyzer.py')
          s = p.read_text()
          old = '''    pair_count = 0
    continuous_count = 0
    for first, second, mask in (
        (arr[:, :-1], arr[:, 1:], interior[:, :-1] & interior[:, 1:]),
        (arr[:-1, :], arr[1:, :], interior[:-1, :] & interior[1:, :]),
    ):
        distances = np.linalg.norm(first - second, axis=2)
        pair_count += int(np.count_nonzero(mask))
        continuous_count += int(np.count_nonzero(mask & (distances >= 1.0) & (distances <= 32.0)))
    transition_ratio = float(continuous_count) / float(max(1, pair_count))
    foreground_bins = np.unique((arr[interior].astype(np.uint8) // 8), axis=0).shape[0]
    return bool(
        foreground_bins >= 12
        and transition_ratio >= 0.08
        and smooth_area_ratio >= 0.90
    )
'''
          new = '''    pair_count = 0
    continuous_count = 0
    hard_boundary_count = 0
    for first, second, mask in (
        (arr[:, :-1], arr[:, 1:], interior[:, :-1] & interior[:, 1:]),
        (arr[:-1, :], arr[1:, :], interior[:-1, :] & interior[1:, :]),
    ):
        distances = np.linalg.norm(first - second, axis=2)
        pair_count += int(np.count_nonzero(mask))
        continuous_count += int(np.count_nonzero(mask & (distances >= 1.0) & (distances <= 32.0)))
        # Issue #153's fallback is a mixed paint model: a genuinely smooth field
        # adjacent to another semantic region through a hard stop.  Requiring a
        # scale-normalized population of large interior jumps prevents a plain
        # smooth ramp (Benchmark seed-05) from being rerouted while retaining the
        # hard-stop production fixture.  Thin AA contours are already excluded by
        # the interior mask above.
        hard_boundary_count += int(np.count_nonzero(mask & (distances >= 80.0)))
    transition_ratio = float(continuous_count) / float(max(1, pair_count))
    foreground_bins = np.unique((arr[interior].astype(np.uint8) // 8), axis=0).shape[0]
    hard_boundary_min = max(4, int(round(0.05 * float(np.sqrt(interior_count)))))
    return bool(
        foreground_bins >= 12
        and transition_ratio >= 0.08
        and hard_boundary_count >= hard_boundary_min
        and smooth_area_ratio >= 0.90
    )
'''
          if old not in s:
              raise SystemExit('analyzer target block not found')
          p.write_text(s.replace(old, new, 1))

          # 2) Journal: keep the Round-3 gradient proof available downstream,
          # but retain the established alpha fail-closed scope.  Alpha fidelity
          # is measured only at the mandatory source-dimension restoration stage;
          # otherwise a refit cannot become eligible merely because we broadened
          # instrumentation.
          p = Path('engine/app/transform_journal.py')
          s = p.read_text()
          old = '''        capture_render = (
            self._measurement_stage_id == "restore_source_dimensions"
            or "gradient_fidelity" in self.required_metrics
        )
        measure_alpha = "alpha_fidelity" in self.required_metrics
'''
          new = '''        is_restore_stage = self._measurement_stage_id == "restore_source_dimensions"
        capture_render = is_restore_stage or "gradient_fidelity" in self.required_metrics
        measure_alpha = is_restore_stage and "alpha_fidelity" in self.required_metrics
'''
          if old not in s:
              raise SystemExit('journal measurement block not found')
          p.write_text(s.replace(old, new, 1))

          # 3) Alpha parent probing: restore the established bounded applicability.
          # Continuous/anti-aliased alpha is handled by the existing source-alpha
          # path; it must not opt into alternate-parent probing that never passed
          # the Exact Final knockout contract.
          p = Path('engine/app/alpha_parent_selection.py')
          s = p.read_text()
          if '_MAX_ALPHA_LEVELS = 4' not in s:
              s = s.replace('_MAX_TRIALS = 4\n', '_MAX_ALPHA_LEVELS = 4\n_MAX_TRIALS = 4\n', 1)
          old = '''    # Parent probing is bounded by _MAX_TRIALS, not by the number of source
    # alpha levels. Continuous/anti-aliased alpha still uses the exact same
    # source-alpha reconstruction gates; only opaque sources are inapplicable.
    if len(levels) <= 1:
        return result
'''
          new = '''    if len(levels) <= 1 or len(levels) > _MAX_ALPHA_LEVELS:
        return result
'''
          if old not in s:
              raise SystemExit('alpha parent applicability block not found')
          p.write_text(s.replace(old, new, 1))

          # Contract: hard-stop ramp remains true, pure smooth ramp stays on the
          # legacy route, palette steps and thin AA remain false.
          p = Path('engine/test_analyzer_contracts.py')
          s = p.read_text()
          needle = '''    assert analyzer.detect_gradient_like_surface(Image.fromarray(ramp, "RGBA")) is True
    assert analyzer.detect_gradient_like_surface(Image.fromarray(stepped, "RGBA")) is False

    thin = np.full((256, 256, 4), 255, dtype=np.uint8)
'''
          replacement = '''    assert analyzer.detect_gradient_like_surface(Image.fromarray(ramp, "RGBA")) is True
    assert analyzer.detect_gradient_like_surface(Image.fromarray(stepped, "RGBA")) is False

    smooth_only = np.full((256, 256, 4), 255, dtype=np.uint8)
    for x in range(24, 232):
        t = (x - 24) / 207.0
        smooth_only[48:208, x, :3] = np.rint(
            np.asarray((225, 40, 35)) * (1.0 - t) + np.asarray((35, 92, 220)) * t
        ).astype(np.uint8)
    assert analyzer.detect_gradient_like_surface(Image.fromarray(smooth_only, "RGBA")) is False

    thin = np.full((256, 256, 4), 255, dtype=np.uint8)
'''
          if needle not in s:
              raise SystemExit('analyzer test insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))

          # Contract: downstream alpha stays fail-closed; gradient-specific
          # downstream measurement has its own existing positive test.
          p = Path('engine/test_transform_journal.py')
          s = p.read_text()
          old = '''    assert accepted == candidate
    assert stage["status"] == "accepted"
    assert "required_metric_unmeasured" not in stage["reason_codes"]
    assert "alpha_stage_metrics_incomplete" not in stage["reason_codes"]
    assert stage["required_unmeasured"] == []
    assert stage["alpha_comparison"] is not None
    assert stage["alpha_comparison"]["alpha_iou"] == pytest.approx(1.0)
'''
          new = '''    assert accepted == parent
    assert stage["status"] == "rolled_back"
    assert "required_metric_unmeasured" in stage["reason_codes"]
    assert "alpha_stage_metrics_incomplete" in stage["reason_codes"]
    assert "alpha_fidelity" in stage["required_unmeasured"]
    assert stage["alpha_comparison"] is None
'''
          if old not in s:
              raise SystemExit('downstream alpha test block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Compile and run focused contracts
        shell: bash
        run: |
          python -m py_compile engine/app/analyzer.py engine/app/transform_journal.py engine/app/alpha_parent_selection.py
          python -m pytest -q engine/test_analyzer_contracts.py engine/test_transform_journal.py
          if [ -f engine/test_alpha_parent_selection.py ]; then
            python -m pytest -q engine/test_alpha_parent_selection.py
          fi
      - name: Commit remediation source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/app/analyzer.py engine/app/transform_journal.py engine/app/alpha_parent_selection.py engine/test_analyzer_contracts.py engine/test_transform_journal.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit'
            exit 1
          fi
          git commit -m 'fix: apply issue 153 manager remediation'
          git push origin HEAD:codex/ai4-round3-gradient-topology
