name: Issue 153 source RGB post-refit guard
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Add source-RGB palette post-refit guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('engine/app/component_quality.py')
          text = p.read_text()
          anchor = '''\ndef score_svg_component_integrity(\n'''
          helper = r'''\ndef measure_discrete_rgb_palette_component_integrity_arrays(\n    original_rgb: np.ndarray,\n    rendered_rgb: np.ndarray,\n    *,\n    palette_size: int = 8,\n    min_component_pixels: int = 2,\n) -> dict[str, Any]:\n    """Second-pass topology guard using source-derived *RGB* palette classes.\n\n    The ordinary winner gate deliberately uses LAB k-means for broad robustness.\n    A geometry mutation can nevertheless invent a tiny island whose rendered\n    colour is absorbed by a neighbouring LAB class.  For inputs already proven\n    palette-like, nearest classification against snapped source RGB fills keeps\n    the semantic colour ownership observable without changing any acceptance\n    threshold.  Continuous-paint inputs remain outside this function through the\n    caller's existing component-gate applicability check.\n    """\n    source = np.asarray(original_rgb, dtype=np.uint8)\n    rendered = np.asarray(rendered_rgb, dtype=np.uint8)\n    if source.shape != rendered.shape:\n        h, w = source.shape[:2]\n        rendered = cv2.resize(rendered, (w, h), interpolation=cv2.INTER_AREA)\n\n    from app.graph_source import canonical_segmentation  # noqa: PLC0415\n    from app.palette_ops import classify_rgb  # noqa: PLC0415\n\n    distinct = int(np.unique(source.reshape(-1, 3), axis=0).shape[0])\n    k_eff = max(1, min(int(palette_size), distinct))\n    source_labels, palette = canonical_segmentation(source, k=k_eff)\n    render_labels = classify_rgb(rendered, palette.astype(np.float32)).astype(np.uint8)\n    min_area = max(1, int(min_component_pixels))\n    class_count = int(max(source_labels.max(initial=0), render_labels.max(initial=0))) + 1\n\n    source_total = render_total = matched_source = matched_render = 0\n    source_match_ious: list[float] = []\n    class_reports: list[dict[str, Any]] = []\n    for class_index in range(class_count):\n        sources = _components(source_labels, class_index, min_area)\n        renders = _components(render_labels, class_index, min_area)\n        if not sources and not renders:\n            continue\n        matches, matched_iou = _optimal_one_to_one_matches(sources, renders)\n        source_total += len(sources)\n        render_total += len(renders)\n        matched_source += len(matches)\n        matched_render += len(matches)\n        source_match_ious.extend(matched_iou)\n        class_reports.append({\n            "class_index": class_index,\n            "source_components": len(sources),\n            "render_components": len(renders),\n            "matched_components": len(matches),\n            "min_source_matched_iou": round(min(matched_iou), 4) if matched_iou else None,\n        })\n\n    if source_total == 0:\n        return {\n            "measured": False, "status": "needs_review",\n            "reason": "no_supported_source_components",\n            "min_component_area": min_area,\n            "palette_size": int(len(palette)),\n        }\n    source_recall = float(matched_source) / float(source_total)\n    render_precision = float(matched_render) / float(render_total) if render_total else 0.0\n    min_true_iou = min(source_match_ious) if source_match_ious else 0.0\n    passed = (\n        source_recall >= _REQUIRED_SOURCE_CC_RECALL\n        and render_precision >= _REQUIRED_RENDER_CC_PRECISION\n        and min_true_iou >= _REQUIRED_MIN_TRUE_CC_IOU\n    )\n    return {\n        "measured": True,\n        "status": "pass" if passed else "fail",\n        "reason": "rgb_palette_component_integrity_pass" if passed else "rgb_palette_component_integrity_fail",\n        "source_cc_recall": round(source_recall, 4),\n        "render_cc_precision": round(render_precision, 4),\n        "min_true_cc_iou": round(float(min_true_iou), 4),\n        "source_components": source_total,\n        "render_components": render_total,\n        "matched_components": matched_source,\n        "min_component_area": min_area,\n        "palette_size": int(len(palette)),\n        "class_reports": class_reports,\n        "measurement_space": "source_snapped_rgb_palette",\n    }\n\n\ndef score_svg_discrete_rgb_palette_integrity(\n    svg_path: Path,\n    original_path: Path,\n    *,\n    mode: str,\n    analysis: dict[str, Any] | None,\n    max_side: int = 512,\n    min_component_pixels: int = 2,\n) -> dict[str, Any]:\n    applicability = component_gate_applicability(mode, analysis)\n    if not applicability["applicable"]:\n        return {\n            "applicable": False, "measured": False, "status": "not_applicable",\n            "reason": applicability["reason"],\n        }\n    try:\n        from app.fidelity import load_reference_rgb, render_svg_to_rgb  # noqa: PLC0415\n        reference, (w, h) = load_reference_rgb(Path(original_path), max_side=max_side)\n        rendered = render_svg_to_rgb(Path(svg_path), w, h)\n        if rendered is None:\n            return {\n                "applicable": True, "measured": False, "status": "needs_review",\n                "reason": "render_unavailable",\n                "open_required_cycle": has_open_required_cycle(Path(svg_path)),\n            }\n        report = measure_discrete_rgb_palette_component_integrity_arrays(\n            reference, rendered, min_component_pixels=min_component_pixels,\n        )\n    except Exception as exc:  # noqa: BLE001\n        return {\n            "applicable": True, "measured": False, "status": "needs_review",\n            "reason": f"measurement_error:{type(exc).__name__}",\n            "open_required_cycle": has_open_required_cycle(Path(svg_path)),\n        }\n    return {\n        "applicable": True,\n        **report,\n        "open_required_cycle": has_open_required_cycle(Path(svg_path)),\n    }\n\n'''.replace('\\n','\n')
          if anchor not in text:
              raise SystemExit('component score anchor missing')
          p.write_text(text.replace(anchor, helper + anchor, 1))

          p = Path('engine/app/pipeline.py')
          text = p.read_text()
          old = '''        from app.component_quality import (\n            gate_candidate_scores, score_svg_component_integrity,\n        )\n        strict_component = score_svg_component_integrity(\n            Path(candidate["svg_path"]), Path(original_path),\n            mode=mode, analysis=analysis, max_side=512,\n            min_component_pixels=2, min_component_fraction=0.0,\n        )\n        if strict_component.get("applicable"):\n            strict_gate = gate_candidate_scores(\n                float(candidate.get("total_score", 0.0)),\n                candidate.get("fidelity_score"), strict_component,\n            )\n            candidate["component_quality"] = strict_component\n            candidate.update({\n                key: strict_gate[key]\n                for key in (\n                    "selection_safe", "selection_disqualified",\n                    "component_quality_status",\n                )\n            })\n            if not _is_selection_safe(candidate):\n                scored[:] = [item for item in scored if item is not candidate]\n                return best, {\n                    **info, "applied": False,\n                    "reason": "post_refit_micro_component_regression",\n                    "post_refit_component_quality": strict_component,\n                }\n'''
          new = '''        from app.component_quality import (\n            gate_candidate_scores,\n            score_svg_component_integrity,\n            score_svg_discrete_rgb_palette_integrity,\n        )\n        strict_component = score_svg_component_integrity(\n            Path(candidate["svg_path"]), Path(original_path),\n            mode=mode, analysis=analysis, max_side=512,\n            min_component_pixels=2, min_component_fraction=0.0,\n        )\n        rgb_component = score_svg_discrete_rgb_palette_integrity(\n            Path(candidate["svg_path"]), Path(original_path),\n            mode=mode, analysis=analysis, max_side=512,\n            min_component_pixels=2,\n        )\n        post_refit_reports = [\n            report for report in (strict_component, rgb_component)\n            if report.get("applicable")\n        ]\n        for report in post_refit_reports:\n            strict_gate = gate_candidate_scores(\n                float(candidate.get("total_score", 0.0)),\n                candidate.get("fidelity_score"), report,\n            )\n            if strict_gate.get("selection_safe") is not True:\n                candidate["selection_safe"] = False\n                candidate["selection_disqualified"] = True\n                candidate["component_quality_status"] = report.get("status")\n                scored[:] = [item for item in scored if item is not candidate]\n                return best, {\n                    **info, "applied": False,\n                    "reason": "post_refit_micro_component_regression",\n                    "post_refit_component_quality": strict_component,\n                    "post_refit_rgb_palette_quality": rgb_component,\n                }\n        if strict_component.get("applicable"):\n            candidate["component_quality"] = strict_component\n        candidate["post_refit_rgb_palette_quality"] = rgb_component\n'''
          if old not in text:
              raise SystemExit('pipeline post-refit anchor missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('engine/test_issue153_post_refit_contract.py')
          text = p.read_text()
          text += '''\n\ndef test_source_rgb_palette_guard_detects_semantic_colour_island() -> None:\n    from app.component_quality import measure_discrete_rgb_palette_component_integrity_arrays\n\n    source = np.full((128, 128, 3), 255, dtype=np.uint8)\n    source[24:104, 24:64] = (220, 35, 45)\n    source[24:104, 64:104] = (30, 90, 220)\n    source[92:104, 42:86] = (245, 195, 25)\n    identity = measure_discrete_rgb_palette_component_integrity_arrays(source, source.copy())\n    assert identity["status"] == "pass"\n    assert identity["render_cc_precision"] == 1.0\n\n    invented = source.copy()\n    invented[70:72, 90] = (220, 35, 45)\n    report = measure_discrete_rgb_palette_component_integrity_arrays(source, invented)\n    assert report["status"] == "fail"\n    assert report["source_cc_recall"] == 1.0\n    assert report["render_cc_precision"] < 1.0\n    assert report["measurement_space"] == "source_snapped_rgb_palette"\n'''
          p.write_text(text)
          PY
          python -m py_compile engine/app/component_quality.py engine/app/pipeline.py engine/test_issue153_post_refit_contract.py
      - name: Run focused Issue 153 guards
        working-directory: engine
        run: |
          python -m pytest -q test_issue153_post_refit_contract.py test_ai2_component_quality.py test_transform_journal.py test_analyzer_contracts.py
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-rgb-palette-guard.yml
          git add engine/app/component_quality.py engine/app/pipeline.py engine/test_issue153_post_refit_contract.py
          git commit -m "Guard boundary refit with source RGB component topology"
          git push origin HEAD:codex/ai4-round3-gradient-topology
