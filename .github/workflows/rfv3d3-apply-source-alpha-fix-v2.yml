name: RFV-3D3 apply verified source-alpha fix v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-apply-source-alpha-fix-v2.yml"

permissions:
  contents: write

concurrency:
  group: rfv3d3-apply-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-tested-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
