        run: |
          python - <<'PY2'
          import base64, os, zlib, hashlib
          payload = ''.join(os.environ['PATCH_B64'].split())
          data = zlib.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(data).hexdigest()
          expected = '8c354f819aa32a63ede6c2e8ea5088c4cdd262ecbf46449a063602ec24ed510b'
          if digest != expected:
              raise SystemExit(f'patch digest mismatch: {digest} != {expected}')
          open('/tmp/rfv3d3-source-alpha.patch', 'wb').write(data)
          PY2
          git apply --check /tmp/rfv3d3-source-alpha.patch
          git apply /tmp/rfv3d3-source-alpha.patch
      - name: Install test dependencies
        run: python -m pip install -r engine/requirements.txt pytest httpx
      - name: Compile and run focused fail-closed tests
        env:
          PYTHONPATH: engine
        run: |
          python -m py_compile \
            engine/app/alpha_candidate_validation.py \
            engine/app/alpha_soft_ellipse.py \
            engine/app/alpha_candidate_painter.py \
            engine/app/transform_journal.py \
            engine/test_rfv3d3_source_alpha_journal.py
          python -m pytest -q \
            engine/test_rfv3d3_source_alpha_journal.py \
            engine/test_alpha_candidate_validation.py
      - name: Commit verified production fix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f \
            .github/workflows/rfv3d3-alpha-journal-diagnostic-v2.yml \
            .github/workflows/rfv3d3-apply-source-alpha-fix.yml \
            .github/workflows/rfv3d3-correct-apply-digest.yml \
            .github/workflows/rfv3d3-correct-apply-digest-v2.yml \
            .github/workflows/rfv3d3-apply-source-alpha-fix-v2.yml
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A engine/app engine/test_rfv3d3_source_alpha_journal.py .github/workflows
          git commit -m "Apply verified RFV-3D3 source-alpha journal fix"
          git push origin "HEAD:${HEAD_REF}"
