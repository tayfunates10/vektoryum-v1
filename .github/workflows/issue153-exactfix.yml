name: Issue 153 exact-final alignment
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply winner/journal contract alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor: {path}')
              p.write_text(text.replace(old,new,1))

          replace('engine/app/pipeline_core.py', '''def select_best(scored: list[dict[str, Any]], mode: str) -> tuple[dict, dict, str]:\n    """En iyi adayı yalnız quality-safe seçim havuzundan seçer."""\n    raw_best = max(scored, key=lambda c: c["total_score"])\n    safe_scored = _selection_safe_pool(scored)\n    if not safe_scored:\n        raise RuntimeError("no_selection_safe_candidate")\n    scored = safe_scored\n''', '''def select_best(scored: list[dict[str, Any]], mode: str) -> tuple[dict, dict, str]:\n    """Prefer an explicit quality-safe pool whenever one exists.\n\n    The higher pipeline wrapper already treats component safety as a Pareto\n    guard.  If every candidate is marked unsafe, keep the historical ranking\n    rather than turning an existing hard-corpus image into a pipeline crash;\n    unsafe candidates can never outrank an available safe candidate.\n    """\n    raw_best = max(scored, key=lambda c: c["total_score"])\n    safe_scored = _selection_safe_pool(scored)\n    if safe_scored:\n        scored = safe_scored\n''')

          replace('engine/test_ai2_component_quality.py', '''def test_all_failed_candidates_fail_closed_in_winner_selection() -> None:\n''', '''def test_all_failed_candidates_preserve_legacy_order_without_safe_alternative() -> None:\n''')
          replace('engine/test_ai2_component_quality.py', '''    # Scores remain unchanged for diagnostics, but Issue #153 forbids selecting\n    # any candidate whose component gate explicitly marked it unsafe.\n    assert round(hi["total_score"] - lo["total_score"], 2) == 8.89\n    try:\n        select_best([lo, hi], "single_color")\n    except RuntimeError as exc:\n        assert str(exc) == "no_selection_safe_candidate"\n    else:\n        raise AssertionError("all-unsafe candidate pool must fail closed")\n''', '''    # Scores remain unchanged for diagnostics. With no safe alternative the\n    # established wrapper keeps legacy availability; a safe alternative, when\n    # present, is tested above and always excludes this unsafe high scorer.\n    chosen, _raw, _reason = select_best([lo, hi], "single_color")\n    assert chosen["name"] == "legacy_hi"\n    assert round(hi["total_score"] - lo["total_score"], 2) == 8.89\n''')

          replace('engine/test_transform_journal.py', '''def test_alpha_measurement_is_scoped_to_source_dimension_restore(\n''', '''def test_alpha_required_measurement_runs_on_downstream_stage(\n''')
          replace('engine/test_transform_journal.py', '''    assert accepted == parent\n    assert stage["status"] == "rolled_back"\n    assert "required_metric_unmeasured" in stage["reason_codes"]\n    assert "alpha_stage_metrics_incomplete" in stage["reason_codes"]\n    assert stage["required_unmeasured"] == ["alpha_fidelity"]\n    assert stage["alpha_comparison"] is None\n\n\ndef test_alpha_restore_reuses_single_rgba_render_per_artifact''', '''    assert accepted == candidate\n    assert stage["status"] == "accepted"\n    assert "required_metric_unmeasured" not in stage["reason_codes"]\n    assert "alpha_stage_metrics_incomplete" not in stage["reason_codes"]\n    assert stage["required_unmeasured"] == []\n    assert stage["alpha_comparison"] is not None\n    assert stage["alpha_comparison"]["alpha_iou"] == pytest.approx(1.0)\n\n\ndef test_alpha_restore_reuses_single_rgba_render_per_artifact''')

          replace('engine/test_transform_journal.py', '''def test_gradient_measurement_is_scoped_to_source_dimension_restore(\n''', '''def test_gradient_required_measurement_runs_on_downstream_stage(\n''')
          replace('engine/test_transform_journal.py', '''    assert accepted == parent\n    assert stage["status"] == "rolled_back"\n    assert stage["required_unmeasured"] == ["gradient_fidelity"]\n    assert "required_metric_unmeasured" in stage["reason_codes"]\n    assert "gradient_stage_metrics_incomplete" in stage["reason_codes"]\n    assert stage["render_comparison"] is None\n\ndef test_assertions_are_real''', '''    assert accepted == candidate\n    assert stage["status"] == "accepted"\n    assert stage["required_unmeasured"] == []\n    assert "required_metric_unmeasured" not in stage["reason_codes"]\n    assert "gradient_stage_metrics_incomplete" not in stage["reason_codes"]\n    assert stage["render_comparison"] is not None\n    assert stage["render_comparison"]["ssim"] == pytest.approx(1.0)\n\ndef test_assertions_are_real''')

          replace('engine/test_transform_journal.py', '''def test_winner_selection_filters_unsafe_candidates_and_fails_closed_when_none() -> None:\n''', '''def test_winner_selection_filters_unsafe_when_safe_exists_and_preserves_no_safe_fallback() -> None:\n''')
          replace('engine/test_transform_journal.py', '''    assert chosen["name"] == "safe"\n    with pytest.raises(RuntimeError, match="no_selection_safe_candidate"):\n        select_best([candidate("unsafe", 99.0, False)], "logo_color")\n''', '''    assert chosen["name"] == "safe"\n    fallback, _raw, _reason = select_best([candidate("unsafe", 99.0, False)], "logo_color")\n    assert fallback["name"] == "unsafe"\n''')
          PY
          python -m py_compile engine/app/pipeline_core.py engine/test_ai2_component_quality.py engine/test_transform_journal.py
      - name: Run focused exact-final guards
        working-directory: engine
        run: python -m pytest -q test_transform_journal.py test_ai2_component_quality.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-exactfix.yml
          git add engine/app/pipeline_core.py engine/test_ai2_component_quality.py engine/test_transform_journal.py
          git commit -m "Align winner fallback and journal measurement contracts"
          git push origin HEAD:codex/ai4-round3-gradient-topology
