name: RFV-3D3 apply RFV-3B reviewed-identity fallback v4

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-apply-rfv3b-identity-fallback-v4.yml"

permissions:
  contents: write

concurrency:
  group: rfv3d3-rfv3b-identity-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-tested-fallback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact reviewed-identity transformation
        run: python .github/rfv3d3_apply_rfv3b_identity.py

      - name: Validate workflow YAML
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in (
              Path('.github/workflows/real-world-fidelity-rfv3b-live.yml'),
              Path('.github/workflows/real-world-fidelity-rfv3e-viewbox-fix.yml'),
          ):
              document = yaml.safe_load(path.read_text())
              assert isinstance(document, dict)
              assert isinstance(document.get('jobs'), dict)
          PY

      - name: Extract acquisition shell
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          path = Path('.github/workflows/real-world-fidelity-rfv3b-live.yml')
          document = yaml.safe_load(path.read_text())
          acquire = next(
              step for step in document['jobs']['acquire']['steps']
              if step.get('name') == 'Acquire or restore the exact 24 reviewed sources'
          )
          Path('/tmp/rfv3b-acquire.sh').write_text(acquire['run'])
          PY

      - name: Validate acquisition shell syntax
        run: bash -n /tmp/rfv3b-acquire.sh

      - name: Run unchanged RFV-3B contracts
        env:
          PYTHONPATH: engine
        run: |
          python -m unittest \
            engine.regression.test_rfv3_live_measurement \
            engine.regression.test_rfv3_live_prepare

      - name: Validate reviewed identity invariants
        run: |
          grep -Fq 'reviewed_identity_mismatch' .github/workflows/real-world-fidelity-rfv3b-live.yml
          grep -Fq '5f151a6cb1a433b0cb0989a67bd7cc7940162f4b36d67903d6ccdd173f9e7d89' \
            .github/workflows/real-world-fidelity-rfv3b-live.yml
          grep -Fq '.github/workflows/real-world-fidelity-rfv3b-live.yml' \
            .github/workflows/real-world-fidelity-rfv3e-viewbox-fix.yml

      - name: Commit reviewed-identity fallback
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f \
            .github/rfv3d3_apply_rfv3b_identity.py \
            .github/workflows/rfv3d3-apply-rfv3b-identity-fallback.yml \
            .github/workflows/rfv3d3-apply-rfv3b-identity-fallback-v2.yml \
            .github/workflows/rfv3d3-apply-rfv3b-identity-fallback-v3.yml \
            .github/workflows/rfv3d3-apply-rfv3b-identity-fallback-v4.yml
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          git commit -m "Fail over RFV-3B on reviewed corpus identity mismatch"
          git push origin "HEAD:${HEAD_REF}"
