name: Temporary painter wrapper cache fix

on:
  push:
    branches: [codex/tmp-painter-wrapper-cache-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tmp-painter-wrapper-cache-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact patch
        run: python .github/tmp_patch_painter.py
      - name: Validate
        run: |
          python -m py_compile engine/app/alpha_candidate_identity.py engine/test_alpha_painter_wrapper_cache.py
          cd engine
          python test_alpha_painter_wrapper_cache.py
      - name: Verify diff
        run: |
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = "engine/app/alpha_candidate_identity.py,engine/test_alpha_painter_wrapper_cache.py"
      - name: Commit clean patch
        run: |
          rm .github/workflows/tmp-painter-wrapper-cache-fix.yml .github/tmp_patch_painter.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve painter measurement cache through wrapper"
          git push origin HEAD:codex/tmp-painter-wrapper-cache-fix
