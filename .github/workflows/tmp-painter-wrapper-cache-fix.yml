name: Temporary painter wrapper cache fix

on:
  push:
    branches:
      - codex/tmp-painter-wrapper-cache-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tmp-painter-wrapper-cache-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact production patch and focused regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/app/alpha_candidate_identity.py")
          text = path.read_text(encoding="utf-8")

          old_sig = "    def apply_with_supportless_simple_silhouette(svg_path, source_path, mode):\n"
          new_sig = "    def apply_with_supportless_simple_silhouette(\n        svg_path, source_path, mode, measurement_cache=None\n    ):\n"
          if text.count(old_sig) != 1:
              raise SystemExit(f"signature replacement count={text.count(old_sig)}")
          text = text.replace(old_sig, new_sig, 1)

          old_return = "            return original_apply(svg_path, source_path, mode)\n"
          new_return = "            return original_apply(\n                svg_path, source_path, mode, measurement_cache=measurement_cache\n            )\n"
          if text.count(old_return) != 1:
              raise SystemExit(f"fallback call replacement count={text.count(old_return)}")
          text = text.replace(old_return, new_return, 1)

          old_report = "            report = original_apply(svg_path, source_path, mode)\n"
          new_report = "            report = original_apply(\n                svg_path, source_path, mode, measurement_cache=measurement_cache\n            )\n"
          if text.count(old_report) != 1:
              raise SystemExit(f"wrapped call replacement count={text.count(old_report)}")
          text = text.replace(old_report, new_report, 1)
          path.write_text(text, encoding="utf-8")

          regression = '''from __future__ import annotations

import ast
import unittest
from pathlib import Path


class PainterWrapperMeasurementCacheTests(unittest.TestCase):
    def test_supportless_wrapper_preserves_measurement_cache_contract(self) -> None:
        source = Path("app/alpha_candidate_identity.py").read_text(encoding="utf-8")
        tree = ast.parse(source)
        wrapper = next(
            node
            for node in ast.walk(tree)
            if isinstance(node, ast.FunctionDef)
            and node.name == "apply_with_supportless_simple_silhouette"
        )
        parameter_names = [arg.arg for arg in wrapper.args.args]
        self.assertIn("measurement_cache", parameter_names)

        original_calls = [
            node
            for node in ast.walk(wrapper)
            if isinstance(node, ast.Call)
            and isinstance(node.func, ast.Name)
            and node.func.id == "original_apply"
        ]
        self.assertEqual(len(original_calls), 2)
        for call in original_calls:
            self.assertTrue(
                any(
                    keyword.arg == "measurement_cache"
                    and isinstance(keyword.value, ast.Name)
                    and keyword.value.id == "measurement_cache"
                    for keyword in call.keywords
                )
            )


if __name__ == "__main__":
    unittest.main()
'''
          Path("engine/test_alpha_painter_wrapper_cache.py").write_text(regression, encoding="utf-8")
          PY
          python -m py_compile engine/app/alpha_candidate_identity.py engine/test_alpha_painter_wrapper_cache.py
          (cd engine && python test_alpha_painter_wrapper_cache.py)
      - name: Verify exact diff scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          expected = [
              "engine/app/alpha_candidate_identity.py",
              "engine/test_alpha_painter_wrapper_cache.py",
          ]
          if changed != expected:
              raise SystemExit(f"unexpected diff scope: {changed!r}")
          PY
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-painter-wrapper-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/app/alpha_candidate_identity.py engine/test_alpha_painter_wrapper_cache.py .github/workflows/tmp-painter-wrapper-cache-fix.yml
          git commit -m "fix: preserve painter measurement cache through wrapper"
          git push origin HEAD:codex/tmp-painter-wrapper-cache-fix
