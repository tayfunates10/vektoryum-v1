name: Run focused public15 patch

on:
  pull_request:
    branches:
      - claude/yoneticilik-sorunlari-gorevler-b1pfya

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/p0-public15-cumulative-mask-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-public15-cumulative-mask-fix
          fetch-depth: 0
      - name: Apply focused production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('engine/app/alpha_candidate_painter.py')
          text = path.read_text(encoding='utf-8')

          if 'mask_encoding == "cumulative"' not in text:
              anchor = '    elif mask_encoding == "rect":\n'
              if anchor not in text:
                  raise SystemExit('mask encoding anchor not found')
              block = '''    elif mask_encoding == "cumulative":
                  cumulative_result = _cumulative_threshold_children(
                      quantized, opacity_by_level, qname
                  )
                  if cumulative_result is not None:
                      mask_children, cumulative_stats = cumulative_result
                      chosen_encoding = "cumulative"
                      contour_stats = {
                          "contour_path_count": int(cumulative_stats["cumulative_threshold_count"]),
                          "contour_command_count": int(cumulative_stats["cumulative_command_count"]),
                          "contour_loop_count": int(cumulative_stats["cumulative_loop_count"]),
                          **cumulative_stats,
                      }
                  else:
                      mask_children = _painter_polygon_children(loops, qname)
          '''
              text = text.replace(anchor, block + anchor, 1)

          if 'cumulative_quantized_specs:' not in text:
              marker = '    attempts: list[dict[str, Any]] = []\n'
              pos = text.find(marker, text.find('    quantized_specs:'))
              if pos < 0:
                  raise SystemExit('quantized specs anchor not found')
              block = '''    cumulative_quantized_specs: list[
                  tuple[str, str, str, np.ndarray, dict[int, float]]
              ] = []
              for target_levels in (32, 16, 8):
                  requant, requant_opacity = _requantize_alpha(grid_alpha, target_levels)
                  cumulative_quantized_specs.append(
                      (f"cumulative-q{target_levels}", "cumulative", "quantized", requant, requant_opacity)
                  )

          '''
              text = text[:pos] + block + text[pos:]

          if 'winner = _evaluate_phase(cumulative_quantized_specs)' not in text:
              anchor = '''    if winner is None:
                  winner = _evaluate_paint_deficit()
          '''
              if anchor not in text:
                  raise SystemExit('winner ladder anchor not found')
              replacement = '''    if winner is None:
                  winner = _evaluate_phase(cumulative_quantized_specs)
              if winner is None:
                  winner = _evaluate_paint_deficit()
          '''
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')

          test = Path('engine/regression/test_public15_cumulative_mask_encoding.py')
          test.write_text('''from __future__ import annotations\n\nimport xml.etree.ElementTree as ET\n\nimport numpy as np\n\nfrom app.alpha_candidate_painter import build_painter_reconstruction_tree\n\n\ndef test_cumulative_mask_encoding_reports_budgeted_path_stats() -> None:\n    ns = "http://www.w3.org/2000/svg"\n    root = ET.Element(f"{{{ns}}}svg", {"width": "4", "height": "4", "viewBox": "0 0 4 4"})\n    ET.SubElement(root, f"{{{ns}}}rect", {"x": "0", "y": "0", "width": "4", "height": "4", "fill": "#336699"})\n    quantized = np.asarray([[1, 1, 2, 2], [1, 1, 2, 2], [0, 1, 2, 3], [0, 1, 3, 3]], dtype=np.int32)\n    opacity = {0: 0.0, 1: 0.25, 2: 0.5, 3: 1.0}\n    candidate, stats = build_painter_reconstruction_tree(root, None, quantized, opacity, 1.0, mask_encoding="cumulative", transaction_id="test")\n    assert stats["reconstruction_mask_encoding"] == "cumulative"\n    assert stats["cumulative_threshold_count"] > 0\n    assert stats["cumulative_command_count"] > 0\n    assert stats["contour_path_count"] == stats["cumulative_threshold_count"]\n    assert stats["contour_command_count"] == stats["cumulative_command_count"]\n    assert len([node for node in candidate.iter() if str(node.tag).endswith("}mask")]) == 1\n''', encoding='utf-8')
          PY

          python -m py_compile engine/app/alpha_candidate_painter.py engine/regression/test_public15_cumulative_mask_encoding.py
          cd engine
          python -m pytest -q regression/test_public15_cumulative_mask_encoding.py
          cd ..
          rm -f .github/workflows/public15-apply-cumulative-fix.yml .github/workflows/public15-run-focused-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): use cumulative quantized mask to close public15 seam"
          git push origin HEAD:codex/p0-public15-cumulative-mask-fix
