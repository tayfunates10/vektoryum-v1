name: RFV-3D3 alpha journal diagnostic v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-alpha-journal-diagnostic-v2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: rfv3d3-alpha-journal-v2-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  VEKTORYUM_WORKERS: "1"
  VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PINNED_ARTIFACT_ID: "8630061266"
  PINNED_ARTIFACT_DIGEST: "sha256:ded13a91be73fc00482f7d1f47404b1b4e08b000dc3ededadf58bdd59a2f6b33"

jobs:
  diagnose-alpha-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Prove production tree equals current main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" "${VALIDATION_SHA}"
          git diff --quiet "${BASE_SHA}" "${VALIDATION_SHA}" -- engine/app engine/benchmark engine/requirements.txt
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libcairo2
          python -m pip install -r engine/requirements.txt pytest httpx
      - name: Download immutable corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rfv3d3-alpha-source"
          mkdir -p "${root}"
          curl --fail-with-body --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}" \
            --output "${root}/metadata.json"
          curl --fail-with-body --location --silent --show-error --retry 3 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            --output "${root}/corpus.zip"
          RFV_ROOT="${root}" python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RFV_ROOT"])
          metadata = json.loads((root / "metadata.json").read_text())
          assert metadata["id"] == int(os.environ["PINNED_ARTIFACT_ID"])
          assert metadata["digest"] == os.environ["PINNED_ARTIFACT_DIGEST"]
          with zipfile.ZipFile(root / "corpus.zip") as package:
              bundle = package.read("rfv2-public-corpus.tar.gz")
          assert hashlib.sha256(bundle).hexdigest() == "1da641ad27b58985e4e1cf8d9972af5a15f5105e85e2c319151a5e373b6afc46"
          destination = root / "corpus"
          destination.mkdir()
          bundle_path = root / "rfv2-public-corpus.tar.gz"
          bundle_path.write_bytes(bundle)
          with tarfile.open(bundle_path, "r:gz") as archive:
              archive.extractall(destination, filter="data")
          PY
      - name: Measure Q04 and Q05 journal stages
        run: |
          mkdir -p "${RUNNER_TEMP}/rfv3d3-alpha-diagnostic"
          RFV_ROOT="${RUNNER_TEMP}/rfv3d3-alpha-source/corpus" \
          RFV_OUT="${RUNNER_TEMP}/rfv3d3-alpha-diagnostic" \
          python - <<'PY'
          import hashlib
          import inspect
          import json
          import os
          import shutil
          import tempfile
          import traceback
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import numpy as np
          from PIL import Image

          from app import pipeline
          from app.alpha_artwork_identity import alpha_transaction_id
          from app.alpha_candidate_knockout import _path_node_counts, _write_tree_to_temp
          from app.alpha_candidate_validation import validate_alpha_reconstruction_contract
          from app.alpha_mask_budget import _journal_limits
          from app.alpha_preprocess import _rgba_from_source_at_size
          from app.alpha_soft_ellipse import _build_soft_ellipse_tree, fit_soft_ellipse
          from app.alpha_svg_mask import _journal_source_rgb
          from app.transform_journal import TransformJournal

          corpus = Path(os.environ["RFV_ROOT"])
          out = Path(os.environ["RFV_OUT"])
          manifest = json.loads((corpus / "qualification-manifest.json").read_text())
          cases = {item["case_id"]: item for item in manifest["cases"]}
          raw_pipeline = inspect.unwrap(pipeline.run_pipeline)

          def clean(value):
              if isinstance(value, np.ndarray):
                  return {
                      "shape": list(value.shape),
                      "dtype": str(value.dtype),
                      "sha256": hashlib.sha256(np.ascontiguousarray(value).tobytes()).hexdigest(),
                  }
              if isinstance(value, dict):
                  return {
                      str(key): clean(item)
                      for key, item in value.items()
                      if not str(key).startswith("_render")
                  }
              if isinstance(value, (list, tuple)):
                  return [clean(item) for item in value]
              if isinstance(value, Path):
                  return str(value)
              return value

          reports = []
          for case_id in ("qualification-public-04", "qualification-public-05"):
              item = cases[case_id]
              source = corpus / "objects" / item["storage_object_id"]
              case_out = out / case_id
              case_out.mkdir(parents=True)
              report = {
                  "case_id": case_id,
                  "category": item["category"],
                  "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                  "engine_sha": os.environ["VALIDATION_SHA"],
                  "base_sha": os.environ["BASE_SHA"],
              }
              try:
                  with tempfile.TemporaryDirectory() as temporary:
                      temp = Path(temporary)
                      with Image.open(source) as opened:
                          image = opened.convert("RGBA")
                          source_rgb = _journal_source_rgb(opened)
                          source_size = opened.size
                      result = raw_pipeline(
                          image,
                          source,
                          "auto",
                          temp,
                          refine=True,
                          edge_cleanup=True,
                      )
                      best = result.get("best")
                      if not isinstance(best, dict) or not best.get("svg_path"):
                          raise RuntimeError("raw pipeline produced no selected SVG")
                      parent = Path(best["svg_path"])
                      parent_bytes = parent.read_bytes()
                      parent_root = ET.fromstring(parent_bytes)
                      parent_counts = _path_node_counts(parent_root)
                      mode = str(result.get("mode_used") or "auto")
                      report.update({
                          "mode": mode,
                          "selected_candidate": best.get("name"),
                          "selection_reason": result.get("selection_reason"),
                          "parent_sha256": hashlib.sha256(parent_bytes).hexdigest(),
                          "parent_bytes": len(parent_bytes),
                          "parent_path_count": parent_counts[0],
                          "parent_node_count": parent_counts[1],
                      })

                      source_full = _rgba_from_source_at_size(source, source_size)
                      source_alpha = np.asarray(source_full[:, :, 3], dtype=np.uint8)
                      fitted = fit_soft_ellipse(source_alpha)
                      report["soft_ellipse_fit"] = clean(fitted)
                      if fitted is None:
                          raise RuntimeError("soft ellipse unexpectedly not applicable")
                      box, geometry, binary_overlap = fitted
                      transaction_id = alpha_transaction_id(
                          hashlib.sha256(parent_bytes).hexdigest(),
                          hashlib.sha256(np.ascontiguousarray(source_alpha).tobytes()).hexdigest(),
                          mode,
                          "soft-ellipse",
                      )
                      candidate_root = _build_soft_ellipse_tree(
                          parent_root,
                          source_alpha.shape,
                          geometry,
                          transaction_id,
                      )
                      candidate = _write_tree_to_temp(candidate_root, parent)
                      try:
                          candidate_bytes = candidate.read_bytes()
                          report["limits"] = _journal_limits(parent_root, len(parent_bytes))
                          report["candidate_sha256"] = hashlib.sha256(candidate_bytes).hexdigest()
                          report["candidate_bytes"] = len(candidate_bytes)
                          report["soft_ellipse_binary_iou"] = binary_overlap
                          try:
                              validation = validate_alpha_reconstruction_contract(
                                  candidate,
                                  source_full,
                                  mode,
                                  parent_counts,
                              )
                              report["alpha_validation"] = clean(validation)
                          except Exception as exc:
                              report["alpha_validation_error"] = f"{type(exc).__name__}:{exc}"

                          image_class = "photo" if mode == "photo_poster" else "clean_logo"
                          journal = TransformJournal(
                              parent,
                              source_rgb,
                              image_class=image_class,
                              required_metrics=set(),
                          )
                          before = journal._measure(parent_bytes)
                          after = journal._measure(candidate_bytes)
                          report["journal_before"] = clean(before)
                          report["journal_after"] = clean(after)
                          report["journal_deltas"] = clean(journal._deltas(before, after))
                          report["journal_reasons"] = journal._decide(
                              before,
                              after,
                              stage_id="source_alpha_vector_mask",
                          )
                          report["journal_render_comparison"] = clean(
                              journal._render_comparison(before, after)
                          )

                          alpha_journal = TransformJournal(
                              parent,
                              source_rgb,
                              image_class=image_class,
                              required_metrics={"alpha_fidelity"},
                          )
                          alpha_journal._measurement_stage_id = "restore_source_dimensions"
                          parent_measured = alpha_journal._measure(parent_bytes)
                          candidate_measured = alpha_journal._measure(candidate_bytes)
                          report["parent_candidate_alpha_comparison"] = clean(
                              alpha_journal._alpha_comparison(parent_measured, candidate_measured)
                          )
                          shutil.copy2(candidate, case_out / "soft-ellipse-candidate.svg")
                      finally:
                          candidate.unlink(missing_ok=True)
              except Exception as exc:
                  report["diagnostic_error"] = f"{type(exc).__name__}:{exc}"
                  report["traceback"] = traceback.format_exc()

              encoded = (json.dumps(report, indent=2, sort_keys=True) + "\n").encode()
              (case_out / "journal-diagnostic.json").write_bytes(encoded)
              (case_out / "journal-diagnostic.sha256").write_text(
                  hashlib.sha256(encoded).hexdigest() + "\n",
                  encoding="utf-8",
              )
              reports.append(report)

          summary = {
              "schema": "vektoryum-rfv3d3-alpha-journal-diagnostic-v2",
              "engine_sha": os.environ["VALIDATION_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "production_tree_equal_to_base": True,
              "cases": reports,
              "release_state": "RFV-3 pending / NO-GO / rfv4_allowed=false",
          }
          encoded = (json.dumps(summary, indent=2, sort_keys=True) + "\n").encode()
          (out / "summary.json").write_bytes(encoded)
          (out / "summary.sha256").write_text(
              hashlib.sha256(encoded).hexdigest() + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfv3d3-alpha-journal-diagnostic-v2-${{ env.VALIDATION_SHA }}
          path: ${{ runner.temp }}/rfv3d3-alpha-diagnostic
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
