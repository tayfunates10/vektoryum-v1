name: Task B public-04 fast Windows proof

on:
  push:
    branches:
      - validation/task-b-public04-proof-windows

permissions:
  contents: read
  actions: read

jobs:
  public04:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: engine
      VEKTORYUM_WORKERS: "1"
      PINNED_ARTIFACT_ID: "8354853386"
      PINNED_ARTIFACT_SHA256: "a8be8c0782a8aeb037a2736de8adbd357c5074ad0da6355562e2543092d6af76"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install production Python dependencies
        shell: pwsh
        run: python -m pip install -r engine/requirements.txt
      - name: Restore pinned corpus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "task-b-public04-fast"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "input") | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $zip = Join-Path $root "pinned.zip"
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:PINNED_ARTIFACT_ID/zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:PINNED_ARTIFACT_SHA256) { throw "pinned artifact sha mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $root "unzipped") -Force
          Copy-Item (Join-Path $root "unzipped/rfv2-public-corpus.tar.gz") (Join-Path $root "input/rfv2-public-corpus.tar.gz")
          Copy-Item (Join-Path $root "unzipped/bundle-checksums.json") (Join-Path $root "input/bundle-checksums.json")
      - name: Prepare immutable corpus
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "task-b-public04-fast"
          python -m engine.regression.rfv3_live_prepare `
            --bundle (Join-Path $root "input/rfv2-public-corpus.tar.gz") `
            --checksums (Join-Path $root "input/bundle-checksums.json") `
            --destination (Join-Path $root "corpus") `
            --evidence-out (Join-Path $root "prepare-evidence.json")
      - name: Measure qualification-public-04 three times
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "task-b-public04-fast"
          $script = Join-Path $root "run_public04.py"
          @'
          import json
          import os
          from pathlib import Path
          from engine.regression.rfv3_measurement_runner import POLICY_PATH, load_json, load_qualification_cases, run_repeated_case, validate_policy

          def main():
              root = Path(os.environ["ROOT"])
              corpus = root / "corpus"
              policy = validate_policy(load_json(POLICY_PATH))
              cases = [c for c in load_qualification_cases(corpus) if c.case_id == "qualification-public-04"]
              assert len(cases) == 1
              result, audit = run_repeated_case(
                  cases[0], corpus_root=corpus, work_root=root / "work" / cases[0].case_id,
                  engine_version=os.environ["HEAD_SHA"], repeat_count=policy["repeat_count"],
                  timeout_seconds=policy["repeat_timeout_seconds"],
                  max_transient_retries=policy["max_transient_retries_per_repeat"],
              )
              payload = {"schema":"vektoryum-task-b-public04-fast-proof-v1","result":result.to_dict(),"audit":audit}
              (root / "public04-result.json").write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n", encoding="utf-8")
              print(json.dumps(payload, sort_keys=True))
          if __name__ == "__main__": main()
          '@ | Set-Content -Encoding utf8 $script
          $env:ROOT = $root
          python $script 2>&1 | Tee-Object -FilePath (Join-Path $root "public04.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-b-public04-fast-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/task-b-public04-fast/public04-result.json
            ${{ runner.temp }}/task-b-public04-fast/public04.log
            ${{ runner.temp }}/task-b-public04-fast/prepare-evidence.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
