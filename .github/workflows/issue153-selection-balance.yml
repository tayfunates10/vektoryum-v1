'''
          helper = anchor + '''

def _needs_component_pareto_guard(candidate: dict[str, Any]) -> bool:
    if bool(candidate.get("hard_stop_gradient")):
        return True
    component = candidate.get("component_quality") or {}
    if not component.get("applicable"):
        return False
    if not component.get("measured"):
        return True
    for name in ("source_cc_recall", "render_cc_precision", "min_true_cc_iou"):
        measured = _finite(component.get(name))
        if measured is None or measured < 1.0 - 1e-9:
            return True
    return False


def _annotate_selection_context(candidate: dict[str, Any] | None, analysis: dict[str, Any]) -> dict[str, Any] | None:
    if candidate is not None:
        candidate["hard_stop_gradient"] = bool(analysis.get("hard_stop_gradient"))
    return candidate
