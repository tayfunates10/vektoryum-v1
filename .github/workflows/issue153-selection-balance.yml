name: Issue153 balanced winner remediation

on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
    paths: [.github/workflows/issue153-selection-balance.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply measured selection remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Analyzer: expose the specific mixed-paint signal that justified the
          # Round-3 fallback. A plain smooth ramp may be a gradient, but is not a
          # hard-stop gradient and therefore must not opt into the QA topology
          # winner override used by Issue #153.
          p = Path('engine/app/analyzer.py')
          s = p.read_text(encoding='utf-8')
          helper = r'''

def detect_hard_stop_gradient_surface(image: Image.Image) -> bool:
    """True only for an opaque continuous foreground field with a hard semantic stop.

    This deliberately mirrors the foreground-local evidence used by
    ``detect_gradient_like_surface`` without the legacy whole-frame gradient
    shortcut. It distinguishes the Issue #153 mixed-paint topology from a plain
    smooth benchmark ramp and from thin antialiased strokes.
    """
    rgba = np.asarray(image.convert("RGBA"), dtype=np.uint8)
    alpha = rgba[:, :, 3]
    if bool(np.any(alpha < 255)):
        return False
    arr = rgba[:, :, :3].astype(np.float32)
    gray = cv2.cvtColor(rgba[:, :, :3], cv2.COLOR_RGB2GRAY)
    edge_mask = cv2.Canny(gray, 70, 160) > 0
    smooth_area_ratio = float(np.mean(~edge_mask))

    h, w = arr.shape[:2]
    ph, pw = max(2, round(h * 0.04)), max(2, round(w * 0.04))
    corners = np.concatenate((
        arr[:ph, :pw].reshape(-1, 3), arr[:ph, -pw:].reshape(-1, 3),
        arr[-ph:, :pw].reshape(-1, 3), arr[-ph:, -pw:].reshape(-1, 3),
    ))
    background = np.median(corners, axis=0)
    foreground = (np.linalg.norm(arr - background[None, None, :], axis=2) > 40.0) & (alpha > 40)
    foreground_count = int(np.count_nonzero(foreground))
    if foreground_count < 20:
        return False
    foreground_distance = cv2.distanceTransform(foreground.astype(np.uint8), cv2.DIST_L2, 5)
    interior = foreground & (foreground_distance >= 3.5)
    interior_count = int(np.count_nonzero(interior))
    if interior_count < 20 or interior_count < 0.10 * foreground_count:
        return False

    pair_count = 0
    continuous_count = 0
    hard_boundary_count = 0
    for first, second, mask in (
        (arr[:, :-1], arr[:, 1:], interior[:, :-1] & interior[:, 1:]),
        (arr[:-1, :], arr[1:, :], interior[:-1, :] & interior[1:, :]),
    ):
        distances = np.linalg.norm(first - second, axis=2)
        pair_count += int(np.count_nonzero(mask))
        continuous_count += int(np.count_nonzero(mask & (distances >= 1.0) & (distances <= 32.0)))
        hard_boundary_count += int(np.count_nonzero(mask & (distances >= 80.0)))
    transition_ratio = float(continuous_count) / float(max(1, pair_count))
    foreground_bins = np.unique((arr[interior].astype(np.uint8) // 8), axis=0).shape[0]
    hard_boundary_min = max(4, int(round(0.05 * float(np.sqrt(interior_count)))))
    return bool(
        foreground_bins >= 12
        and transition_ratio >= 0.08
        and hard_boundary_count >= hard_boundary_min
        and smooth_area_ratio >= 0.90
    )
'''
