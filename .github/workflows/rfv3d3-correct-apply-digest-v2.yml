name: RFV-3D3 correct staged patch digest v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-correct-apply-digest-v2.yml"

permissions:
  contents: write

concurrency:
  group: rfv3d3-digest-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  correct-digest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct current staged digest and remove correction workflows
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git pull --ff-only origin "${HEAD_REF}"
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/rfv3d3-apply-source-alpha-fix.yml')
          text = path.read_text(encoding='utf-8')
          pattern = r'(sha256sum /tmp/rfv3d3-source-alpha\.patch \| cut -d\x27 \x27 -f1\)" = ")[0-9a-f]{64}("$)'
          replacement = r'\g<1>8c354f819aa32a63ede6c2e8ea5088c4cdd262ecbf46449a063602ec24ed510b\g<2>'
          updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'expected exactly one patch digest assertion, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          git rm -f \
            .github/workflows/rfv3d3-correct-apply-digest.yml \
            .github/workflows/rfv3d3-correct-apply-digest-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rfv3d3-apply-source-alpha-fix.yml
          git commit -m "Correct RFV-3D3 staged patch digest"
          git push origin "HEAD:${HEAD_REF}"
