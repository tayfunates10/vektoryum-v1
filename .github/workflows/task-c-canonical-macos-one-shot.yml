name: Task C canonical macOS one-shot

on:
  push:
    branches:
      - codex/task-c-canonical-build

permissions:
  contents: write

jobs:
  patch-and-test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-c-canonical-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Apply canonical Task C patch
        run: python .github/task_c_canonical_patch.py
      - name: Syntax and diff checks
        run: |
          python -m py_compile engine/app/alpha_candidate_paint_deficit.py engine/app/alpha_candidate_painter.py engine/test_alpha_painter_paint_deficit.py
          git diff --check
      - name: Install Python dependencies
        working-directory: engine
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run painter regression contracts
        working-directory: engine
        run: >-
          python -m pytest -q
          test_alpha_painter_paint_deficit.py
          test_alpha_painter_cumulative_levels.py
          test_alpha_painter_ledger.py
          test_alpha_painter_stroke_continuation.py
          test_alpha_painter_polygon_quantized_retry.py
      - name: Commit tested production patch
        run: |
          rm -f .github/workflows/task-c-canonical-one-shot.yml .github/workflows/task-c-canonical-macos-one-shot.yml .github/task_c_canonical_patch.py .task-c-canonical-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: compact byte-bound paint-deficit support palette"
          git push origin HEAD:codex/task-c-canonical-build
