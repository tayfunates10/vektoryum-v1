name: RFV-3D3 correct staged patch digest

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rfv3d3-correct-apply-digest.yml"

permissions:
  contents: write

jobs:
  correct-digest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct exact patch digest and self-delete
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rfv3d3-apply-source-alpha-fix.yml')
          text = path.read_text(encoding='utf-8')
          old = 'c21d1325c9caa9f75b56fc3e1520fe5f4e31099fa053cd0d5ebf9eb6fd7e4638'
          new = '8c354f819aa32a63ede6c2e8ea5088c4cdd262ecbf46449a063602ec24ed510b'
          if text.count(old) != 1:
              raise SystemExit('expected staged digest not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/rfv3d3-correct-apply-digest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rfv3d3-apply-source-alpha-fix.yml
          git commit -m "Correct RFV-3D3 staged patch digest"
          git push origin "HEAD:${HEAD_REF}"
