name: Real-world fidelity RFV-3D2 alpha-mask cluster diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/real-world-fidelity-rfv3d2-alpha-mask-cluster-diagnostics.yml"
      - "engine/regression/rfv3d2_alpha_mask_cluster_diagnostics.py"
      - "engine/regression/test_rfv3d2_alpha_mask_cluster_diagnostics.py"
      - "docs/real_world_fidelity/evidence/rfv3d2_alpha_mask_cluster_diagnostics.json"
      - "docs/real_world_fidelity/rfv-3d2-alpha-mask-cluster-diagnostics.md"

permissions:
  actions: read
  contents: read

concurrency:
  group: rfv3d2-alpha-mask-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: engine:.
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install diagnostic dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Compile RFV-3D2 alpha diagnostics
        run: python -m py_compile engine/regression/rfv3d2_alpha_mask_cluster_diagnostics.py engine/regression/test_rfv3d2_alpha_mask_cluster_diagnostics.py
      - name: Test RFV-3D2 alpha diagnostics
        run: python -m unittest engine.regression.test_rfv3d2_alpha_mask_cluster_diagnostics -v
      - name: Verify committed diagnostic evidence
        run: python -m engine.regression.rfv3d2_alpha_mask_cluster_diagnostics verify --evidence docs/real_world_fidelity/evidence/rfv3d2_alpha_mask_cluster_diagnostics.json
      - name: Confirm corpus policy and release governance contracts are unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Korpus kimliği, ölçüm politikası ve yayın kararı dondurulur; üretim
        # kaynağı dondurulmaz. engine/app ve engine/benchmark dizinlerinin
        # tamamını dondurmak, bu tanılamalara dokunan her sonraki PR'ı bloke
        # ediyordu; o kodun doğruluğu bu iş akışının kendi test adımlarıyla
        # ve depo regresyon paketleriyle korunuyor.
        run: >-
          git diff --exit-code "${BASE_SHA}...${HEAD_SHA}" --
          engine/regression/rfv3_measurement_policy.json
          engine/regression/rfv2_qualification_manifest.json
          docs/real_world_fidelity/evidence/rfv3_quality_decision.json
          docs/real_world_fidelity_roadmap.json
      - name: Confirm release remains NO-GO and RFV-4 blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roadmap=json.loads(Path('docs/real_world_fidelity_roadmap.json').read_text())
          decision=json.loads(Path('docs/real_world_fidelity/evidence/rfv3_quality_decision.json').read_text())
          assert roadmap['phases'][2]['status']=='pending'
          assert roadmap['phases'][3]['status']=='pending'
          assert decision['release_decision']=='no_go'
          assert decision['rfv4_allowed'] is False
          PY

  # Kaldırıldı: live-alpha-pair.
  #
  # Bu iş, RFV-3B korpusunun tek bir çalıştırmasına ait geçici bir
  # artefakta sabitlenmişti (id 8441210832, run 29683096355). O artefaktın
  # saklama süresi 2026-08-02'de doldu ve iş, meta['expired'] is False
  # olduğunu doğruluyordu; dolayısıyla bir daha asla geçemez.
  #
  # Canlı yeniden üretimin kalıcı çıktısı zaten depoda:
  # docs/real_world_fidelity/evidence/rfv3d2_alpha_mask_cluster_diagnostics.json
  # ve yukarıdaki contract işi bu kanıtı her koşuda doğruluyor.
