name: Issue 153 shared-boundary post-refit safety 2
on:
  push:
    branches: [codex/ai4-round3-gradient-topology]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai4-round3-gradient-topology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt pytest
      - name: Apply strict post-boundary-refit component observability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor {path}')
              p.write_text(text.replace(old,new,1))

          replace('engine/app/component_quality.py', '''def measure_component_integrity_arrays(\n    original_rgb: np.ndarray,\n    rendered_rgb: np.ndarray,\n    *,\n    k: int = _KMEANS_K,\n) -> dict[str, Any]:\n''', '''def measure_component_integrity_arrays(\n    original_rgb: np.ndarray,\n    rendered_rgb: np.ndarray,\n    *,\n    k: int = _KMEANS_K,\n    min_component_pixels: int | None = None,\n    min_component_fraction: float | None = None,\n) -> dict[str, Any]:\n''')
          replace('engine/app/component_quality.py', '''    h, w = cls_o.shape[:2]\n    min_area = max(_MIN_COMPONENT_PIXELS, int(_MIN_COMPONENT_FRACTION * h * w))\n''', '''    h, w = cls_o.shape[:2]\n    min_pixels = _MIN_COMPONENT_PIXELS if min_component_pixels is None else max(1, int(min_component_pixels))\n    min_fraction = _MIN_COMPONENT_FRACTION if min_component_fraction is None else max(0.0, float(min_component_fraction))\n    min_area = max(min_pixels, int(min_fraction * h * w))\n''')
          replace('engine/app/component_quality.py', '''def score_svg_component_integrity(\n    svg_path: Path,\n    original_path: Path,\n    *,\n    mode: str,\n    analysis: dict[str, Any] | None,\n    max_side: int = 512,\n) -> dict[str, Any]:\n''', '''def score_svg_component_integrity(\n    svg_path: Path,\n    original_path: Path,\n    *,\n    mode: str,\n    analysis: dict[str, Any] | None,\n    max_side: int = 512,\n    min_component_pixels: int | None = None,\n    min_component_fraction: float | None = None,\n) -> dict[str, Any]:\n''')
          replace('engine/app/component_quality.py', '''        report = measure_component_integrity_arrays(reference, rendered)\n''', '''        report = measure_component_integrity_arrays(\n            reference, rendered,\n            min_component_pixels=min_component_pixels,\n            min_component_fraction=min_component_fraction,\n        )\n''')

          replace('engine/app/pipeline.py', '''def _apply_boundary_refit(\n    best: dict[str, Any],\n    mode: str,\n    analysis: dict[str, Any],\n    original_path: Path,\n    job_dir: Path,\n    scored: list[dict[str, Any]],\n) -> tuple[dict[str, Any], dict[str, Any]]:\n    candidate, info = _base_apply_boundary_refit(\n        best, mode, analysis, original_path, job_dir, scored\n    )\n    if _is_selection_safe(best) and not _is_selection_safe(candidate):\n''', '''def _apply_boundary_refit(\n    best: dict[str, Any],\n    mode: str,\n    analysis: dict[str, Any],\n    original_path: Path,\n    job_dir: Path,\n    scored: list[dict[str, Any]],\n) -> tuple[dict[str, Any], dict[str, Any]]:\n    candidate, info = _base_apply_boundary_refit(\n        best, mode, analysis, original_path, job_dir, scored\n    )\n    if candidate is not best and _is_selection_safe(best):\n        from app.component_quality import (\n            gate_candidate_scores, score_svg_component_integrity,\n        )\n        strict_component = score_svg_component_integrity(\n            Path(candidate["svg_path"]), Path(original_path),\n            mode=mode, analysis=analysis, max_side=512,\n            min_component_pixels=2, min_component_fraction=0.0,\n        )\n        if strict_component.get("applicable"):\n            strict_gate = gate_candidate_scores(\n                float(candidate.get("total_score", 0.0)),\n                candidate.get("fidelity_score"), strict_component,\n            )\n            candidate["component_quality"] = strict_component\n            candidate.update({\n                key: strict_gate[key]\n                for key in (\n                    "selection_safe", "selection_disqualified",\n                    "component_quality_status",\n                )\n            })\n            if not _is_selection_safe(candidate):\n                scored[:] = [item for item in scored if item is not candidate]\n                return best, {\n                    **info, "applied": False,\n                    "reason": "post_refit_micro_component_regression",\n                    "post_refit_component_quality": strict_component,\n                }\n    if _is_selection_safe(best) and not _is_selection_safe(candidate):\n''')

          p=Path('engine/test_ai2_component_quality.py')
          text=p.read_text()
          text += '''\n\ndef test_strict_post_refit_measurement_detects_two_pixel_invented_island() -> None:\n    original = np.full((128, 128, 3), 255, dtype=np.uint8)\n    original[24:104, 24:64] = (220, 35, 45)\n    original[24:104, 64:104] = (30, 90, 220)\n    rendered = original.copy()\n    rendered[70:72, 90] = (220, 35, 45)\n\n    legacy = measure_component_integrity_arrays(original, rendered)\n    strict = measure_component_integrity_arrays(\n        original, rendered, min_component_pixels=2, min_component_fraction=0.0,\n    )\n    assert legacy["status"] == "pass"\n    assert strict["status"] == "fail"\n    assert strict["render_cc_precision"] < 1.0\n    assert strict["min_component_area"] == 2\n'''
          p.write_text(text)
          PY
          python -m py_compile engine/app/component_quality.py engine/app/pipeline.py engine/test_ai2_component_quality.py
      - name: Run focused component and journal contracts
        working-directory: engine
        run: python -m pytest -q test_ai2_component_quality.py test_transform_journal.py
      - name: Commit patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git rm .github/workflows/issue153-sharedfix.yml .github/workflows/issue153-sharedfix2.yml
          git add engine/app/component_quality.py engine/app/pipeline.py engine/test_ai2_component_quality.py
          git commit -m "Revalidate component safety after boundary refit"
          git push origin HEAD:codex/ai4-round3-gradient-topology
